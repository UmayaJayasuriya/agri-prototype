<title>AgrI Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-sized app on the left, a prototype guide beside it; stacks at phone width. */
:root{
  --ground:#e7ece3; --app:#f2f5ee; --panel:#ffffff; --panel-2:#eaf0e5;
  --ink:#1b2317; --ink-2:#56614f; --line:#d3dbcb;
  --leaf:#2d6a39; --leaf-soft:#dbeada; --on-leaf:#ffffff;
  --turmeric:#b87c0c; --turmeric-soft:#f6e8c9;
  --clay:#b1452a; --clay-soft:#f5ddd4;
  --sky:#2b6a8a; --sky-soft:#dbe9f0;
  --loam:#3a2c21;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0e110d; --app:#141812; --panel:#1b2019; --panel-2:#222820;
  --ink:#e6ebde; --ink-2:#a2ac98; --line:#30372c;
  --leaf:#7fc48c; --leaf-soft:#1e3322; --on-leaf:#0d1a10;
  --turmeric:#e7b54a; --turmeric-soft:#3a2f16;
  --clay:#ef8c6e; --clay-soft:#3e231b;
  --sky:#82bbd8; --sky-soft:#18303b;
  --loam:#2a2119; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0e110d; --app:#141812; --panel:#1b2019; --panel-2:#222820;
  --ink:#e6ebde; --ink-2:#a2ac98; --line:#30372c;
  --leaf:#7fc48c; --leaf-soft:#1e3322; --on-leaf:#0d1a10;
  --turmeric:#e7b54a; --turmeric-soft:#3a2f16;
  --clay:#ef8c6e; --clay-soft:#3e231b;
  --sky:#82bbd8; --sky-soft:#18303b;
  --loam:#2a2119; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.stage{height:100%;display:flex;justify-content:center}
.device{width:100%;max-width:520px;height:100%;background:var(--app);position:relative;overflow:hidden;border-inline:1px solid var(--line)}
.app{position:absolute;inset:0;display:flex;flex-direction:column}

/* app bar */
.appbar{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;background:var(--app)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--leaf);color:var(--on-leaf);display:grid;place-items:center}
.brand i{font-style:normal;color:var(--turmeric)}
.spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;position:relative}
.iconbtn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--clay)}
.avatar{font-family:var(--display);font-weight:700;background:var(--leaf-soft);color:var(--leaf);border-color:transparent}
.offline{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--turmeric-soft);color:var(--turmeric)}

.screen{flex:1;overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.screen.chatmode{padding-bottom:0}

/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel);padding:6px 4px 8px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-2);padding:6px 0;cursor:pointer;border-radius:10px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--leaf)}
.tab[aria-current="page"] svg{stroke-width:2.3}

svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-h h2{font-size:17px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.xs{font-size:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--leaf);color:var(--on-leaf);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--leaf);border:1px solid var(--line)}
.btn.soft{background:var(--leaf-soft);color:var(--leaf)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--leaf);font-weight:700;cursor:pointer;font-size:13px}

.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lbl{font-size:12px;font-weight:700;color:var(--ink-2)}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--panel-2);border-radius:11px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--ink)}
.seg label:has(input:checked){background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.12);color:var(--ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--leaf)}

/* status pills: saturation + suitability */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-under{background:var(--leaf-soft);color:var(--leaf)}
.st-bal{background:var(--sky-soft);color:var(--sky)}
.st-crowd{background:var(--turmeric-soft);color:var(--turmeric)}
.st-over{background:var(--clay-soft);color:var(--clay)}
.st-hidden{background:var(--panel-2);color:var(--ink-2)}

/* home */
.hello h1{font-size:26px;letter-spacing:-.02em}
.season{background:var(--loam);color:#f3ecdf;border-radius:18px;padding:16px;position:relative;overflow:hidden}
.season .eyebrow{color:#d9c9a8}
.season h2{font-size:20px;margin-top:4px}
.season p{color:#e6dcc8;font-size:13px;margin-top:6px;max-width:30ch}
.season canvas{position:absolute;right:-8px;bottom:-8px;width:130px;height:110px;opacity:.9}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.qa .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--leaf-soft);color:var(--leaf)}
.qa:nth-child(2) .ic{background:var(--turmeric-soft);color:var(--turmeric)}
.qa:nth-child(3) .ic{background:var(--sky-soft);color:var(--sky)}
.qa:nth-child(4) .ic{background:var(--clay-soft);color:var(--clay)}
.qa b{font-size:14px}
.qa span{font-size:12px;color:var(--ink-2)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
button.li{cursor:pointer}
.li .t{font-weight:700}
.li .s{font-size:12px;color:var(--ink-2)}
.crop-ic{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px}
.right{text-align:right;flex-shrink:0}

/* plan */
.result-head{display:flex;gap:14px;align-items:center}
.dial{width:104px;height:104px;flex-shrink:0}
.dial .trk{stroke:var(--panel-2)}
.dial text{fill:var(--ink);font-family:var(--display);font-weight:800}
.dial .sub{fill:var(--ink-2);font-family:var(--body);font-weight:600;font-size:10px}
.factor{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--leaf)}
.bar>i.mid{background:var(--turmeric)}
.bar>i.low{background:var(--clay)}
.factor .note{grid-column:1/-1;font-size:11.5px;color:var(--ink-2);margin-top:-6px}
.econ{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.econ div{background:var(--panel);padding:10px}
.econ b{display:block;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.econ span{font-size:11.5px;color:var(--ink-2)}
.econ .pos{color:var(--leaf)} .econ .neg{color:var(--clay)}
.callout{border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.callout.warn{background:var(--clay-soft);color:var(--ink)}
.callout.good{background:var(--leaf-soft);color:var(--ink)}
.callout.info{background:var(--sky-soft);color:var(--ink)}
.callout svg{flex-shrink:0;margin-top:1px}

/* market */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile b{display:block;font-family:var(--display);font-size:22px}
.tile span{font-size:11px;color:var(--ink-2);font-weight:600}
.satbar{position:relative;height:8px;border-radius:99px;background:var(--panel-2);margin-top:6px}
.satbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.satbar .ref{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);opacity:.6}
.locked{position:relative}
.locked .veil{filter:blur(4px);pointer-events:none;user-select:none}
.locked .lockmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px}
.lockmsg .card{box-shadow:0 10px 30px -10px rgba(0,0,0,.3)}
.chart text{fill:var(--ink-2);font-size:10px;font-family:var(--mono)}
.chart .grid{stroke:var(--line)}
.chart .ln{stroke:var(--leaf);fill:none;stroke-width:2}
.chart .area{fill:var(--leaf);opacity:.12}
.chart .fc{stroke:var(--turmeric);stroke-dasharray:4 4;fill:none;stroke-width:2}
.chart .fcdot{fill:var(--turmeric)}
.chart .enddot{fill:var(--leaf)}
.regbar{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;font-size:12.5px}

/* identify */
.drop{border:1.5px dashed var(--line);border-radius:16px;padding:16px;text-align:center;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.drop.over{border-color:var(--leaf);background:var(--leaf-soft)}
.samples{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.sample{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:4px;cursor:pointer;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-2)}
.sample img{width:58px;height:58px;border-radius:9px;display:block}
.idwrap{display:flex;gap:12px;align-items:flex-start}
.idwrap canvas{width:112px;height:112px;border-radius:12px;flex-shrink:0;background:var(--panel-2)}
.prob{display:grid;grid-template-columns:84px 1fr 38px;gap:8px;align-items:center;font-size:12.5px}

/* chat */
.msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.msg{max-width:86%;padding:10px 12px;border-radius:16px;font-size:14px}
.msg.me{align-self:flex-end;background:var(--leaf);color:var(--on-leaf);border-bottom-right-radius:5px}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.bot .li{padding:7px 0}
.msg p+p{margin-top:6px}
.typing span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--ink-2);animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.composer{position:sticky;bottom:0;background:var(--app);padding:10px 0 12px;display:flex;flex-direction:column;gap:8px;margin-top:auto}
.composer form{display:flex;gap:8px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:11px 14px}
.composer .btn{border-radius:99px;padding:0 16px}

/* sheet + toast */
.sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-back{position:absolute;inset:0;background:rgba(10,14,8,.45)}
.sheet-body{position:relative;background:var(--app);border-radius:22px 22px 0 0;max-height:88%;overflow-y:auto;padding:10px 16px 20px;display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet-body .grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 2px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:30;background:var(--ink);color:var(--app);padding:11px 14px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.tier{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.tier.cur{border-color:var(--leaf)}
.tier ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.quota{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* login */
.login{padding:26px 22px;display:flex;flex-direction:column;gap:16px;flex:1;overflow-y:auto}
.login .hero{background:var(--loam);border-radius:22px;padding:22px 18px;color:#f3ecdf;position:relative;overflow:hidden;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end}
.login .hero h1{font-size:40px;letter-spacing:-.03em;font-weight:800}
.login .hero h1 i{font-style:normal;color:#e9b44c}
.login .hero p{color:#e2d7c2;font-size:14px;max-width:26ch;margin-top:4px;position:relative}
.login .hero canvas{position:absolute;right:0;top:0;width:100%;height:100%;opacity:.55}
.login .hero > *:not(canvas){position:relative}
.demo-hint{font-family:var(--mono);font-size:12px;background:var(--turmeric-soft);color:var(--ink);padding:6px 10px;border-radius:8px}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

@media (max-width:520px){.device{border-inline:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>

<div class="stage">
  <section class="device" aria-label="AgrI mobile app prototype">
    <div class="app" id="app">
      <header class="appbar" id="appbar" hidden></header>
      <main class="screen" id="screen"></main>
      <nav class="tabbar" id="tabbar" hidden aria-label="Main"></nav>
      <div class="sheet" id="sheet" hidden></div>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
  </section>

</div>

<script>
"use strict";
/* =====================================================================
   1. DATA
   ===================================================================== */

// Sri Lankan districts: climatic zone (Wet/Intermediate/Dry), elevation band
// (Low/Mid/Up country), seasonal rainfall in mm, mean temperature °C, typical soil.
const DISTRICTS = {
  'Colombo':     {z:'W',e:'L',maha:1100,yala:1300,t:28,  soil:'RYP'},
  'Gampaha':     {z:'W',e:'L',maha:1000,yala:1200,t:28,  soil:'RYP'},
  'Kalutara':    {z:'W',e:'L',maha:1300,yala:1700,t:27.5,soil:'RYP'},
  'Galle':       {z:'W',e:'L',maha:1100,yala:1300,t:27,  soil:'RYP'},
  'Matara':      {z:'W',e:'L',maha:900, yala:1100,t:27,  soil:'RYP'},
  'Ratnapura':   {z:'W',e:'M',maha:1500,yala:2200,t:26,  soil:'RYP'},
  'Kegalle':     {z:'W',e:'M',maha:1400,yala:1800,t:26,  soil:'RYP'},
  'Kandy':       {z:'W',e:'M',maha:1000,yala:900, t:24,  soil:'RYP'},
  'Nuwara Eliya':{z:'W',e:'U',maha:900, yala:1100,t:16,  soil:'RYP'},
  'Badulla':     {z:'I',e:'U',maha:1100,yala:500, t:21,  soil:'RYP'},
  'Matale':      {z:'I',e:'M',maha:1000,yala:600, t:25,  soil:'RBE'},
  'Kurunegala':  {z:'I',e:'L',maha:900, yala:700, t:27.5,soil:'RBE'},
  'Puttalam':    {z:'I',e:'L',maha:800, yala:400, t:28,  soil:'SR'},
  'Monaragala':  {z:'I',e:'L',maha:1100,yala:450, t:27,  soil:'RBE'},
  'Hambantota':  {z:'D',e:'L',maha:700, yala:350, t:28,  soil:'RBE'},
  'Anuradhapura':{z:'D',e:'L',maha:900, yala:350, t:28,  soil:'RBE'},
  'Polonnaruwa': {z:'D',e:'L',maha:1100,yala:300, t:28.5,soil:'RBE'},
  'Ampara':      {z:'D',e:'L',maha:1300,yala:300, t:28,  soil:'LHG'},
  'Batticaloa':  {z:'D',e:'L',maha:1400,yala:250, t:28.5,soil:'SR'},
  'Trincomalee': {z:'D',e:'L',maha:1100,yala:250, t:29,  soil:'RBE'},
  'Vavuniya':    {z:'D',e:'L',maha:1000,yala:300, t:28.5,soil:'RBE'},
  'Mannar':      {z:'D',e:'L',maha:700, yala:200, t:29,  soil:'SR'},
  'Kilinochchi': {z:'D',e:'L',maha:1000,yala:250, t:28.5,soil:'RYL'},
  'Mullaitivu':  {z:'D',e:'L',maha:1100,yala:250, t:28.5,soil:'RBE'},
  'Jaffna':      {z:'D',e:'L',maha:900, yala:150, t:29,  soil:'RYL'},
};
const DISTRICT_NAMES = Object.keys(DISTRICTS).sort();
const ZONE_NAME = {W:'Wet zone', I:'Intermediate zone', D:'Dry zone'};
const ELEV_NAME = {L:'Low country', M:'Mid country', U:'Up country'};
const SOILS = {
  RBE:'Reddish Brown Earth', LHG:'Low Humic Gley', RYP:'Red-Yellow Podzolic',
  ALL:'Alluvial', SR:'Sandy Regosol', RYL:'Red-Yellow Latosol'
};
// Irrigation adds effective water on top of seasonal rainfall (mm).
const WATER = {
  rain:{name:'Rain-fed only', add:0},
  well:{name:'Agro-well / hand watering', add:250},
  minor:{name:'Minor tank', add:400},
  major:{name:'Major irrigation scheme', add:700},
};
const SEASONS = {
  maha:{name:'Maha', long:'Maha 2026/27', months:'Oct–Mar', monsoon:'North-East monsoon'},
  yala:{name:'Yala', long:'Yala 2027', months:'Apr–Sep', monsoon:'South-West monsoon'},
};

// Crop profiles. Weights are 0..1 preference per factor.
// yield = kg/acre at full suitability, cost = LKR/acre inputs, price = LKR/kg typical farm-gate,
// demand = relative market size used to size district demand.
const C = (id, name, o) => ({id, name, market:true, ...o});
const CROPS = [

/* =====================================================================
   2. MODELS
   ===================================================================== */

// Deterministic pseudo-random helpers so sample data is stable between reloads.
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function currentSeason(date = new Date()){
  const m = date.getMonth();            // Maha: Oct–Mar, Yala: Apr–Sep.
  if (m >= 3 && m <= 7) return 'yala';  // Apr–Aug → currently Yala
  return 'maha';                        // Sep onward → upcoming/ongoing Maha
}

/* ---- 2a. Crop suitability model ------------------------------------ */
const FACTOR_WEIGHTS = {zone:.10, elev:.20, temp:.25, water:.25, soil:.12, season:.08};

function rangeScore(v, [lo, hi], perUnit){
  if (v >= lo && v <= hi) return 1;
  const d = v < lo ? lo - v : v - hi;
  return clamp(1 - d * perUnit, 0, 1);
}
function waterScore(w, [lo, hi]){
  if (w >= lo && w <= hi) return 1;
  if (w < lo) return clamp(1 - (lo - w) / lo * 1.5, 0, 1);   // drought stress
  return clamp(1 - (w - hi) / hi * 0.8, 0.2, 1);              // excess water
}

/**
 * Score how suitable a crop is for given conditions.
 * @param {string} cropId
 * @param {{district:string, season:'maha'|'yala', soil:string, water:string}} inp
 * @returns {{score:number, label:string, cls:string, factors:Array}}
 */
function suitability(cropId, inp){
  const c = CROP[cropId], d = DISTRICTS[inp.district];
  const temp = d.t + (inp.season === 'maha' ? -0.8 : 0.6);
  const water = d[inp.season] + WATER[inp.water].add;
  const f = {
    zone:  c.zone[d.z] ?? .3,
    elev:  c.elev[d.e] ?? .3,
    temp:  rangeScore(temp, c.temp, .2),
    water: waterScore(water, c.rain),
    soil:  c.soil[inp.soil] ?? .4,
    season:c.season[inp.season] ?? .7,
  };
  let score = 0;
  for (const k in FACTOR_WEIGHTS) score += FACTOR_WEIGHTS[k] * f[k];
  // Limiting-factor penalty: one very poor factor (e.g. far too hot) caps the whole crop.
  score = Math.round(score * (0.6 + 0.4 * Math.min(...Object.values(f))) * 100);
  const factors = [
    {k:'zone',  name:'Climate zone', v:f.zone,  note:ZONE_NAME[d.z]},
    {k:'elev',  name:'Elevation',    v:f.elev,  note:ELEV_NAME[d.e]},
    {k:'temp',  name:'Temperature',  v:f.temp,  note:`${temp.toFixed(1)} °C season mean · ideal ${c.temp[0]}–${c.temp[1]} °C`},
    {k:'water', name:'Water',        v:f.water, note:`${water} mm rain + irrigation · needs ${c.rain[0]}–${c.rain[1]} mm`},
    {k:'soil',  name:'Soil',         v:f.soil,  note:SOILS[inp.soil]},
    {k:'season',name:'Season fit',   v:f.season,note:`${SEASONS[inp.season].name} (${SEASONS[inp.season].months})`},
  ];
  return {score, ...suitLabel(score), factors};
}
function suitLabel(s){
  if (s >= 75) return {label:'Highly suitable', cls:'st-under'};
  if (s >= 60) return {label:'Suitable', cls:'st-bal'};
  if (s >= 45) return {label:'Marginal', cls:'st-crowd'};
  return {label:'Not suitable', cls:'st-over'};
}

/* ---- 2b. Market / crop-saturation model ---------------------------- */
// Sample aggregated planting data per season|district|crop:
//   D = expected demand (acres the local market absorbs), P = planned acres, k = farmers.
// A few known hotspots are exaggerated so oversupply is visible in the demo.
const HOTSPOTS = {
  'yala|Matale|bigonion':1.9, 'yala|Anuradhapura|bigonion':1.65, 'maha|Nuwara Eliya|potato':1.5,
  'maha|Nuwara Eliya|carrot':1.7, 'maha|Anuradhapura|chilli':1.45, 'maha|Polonnaruwa|paddy':1.3,
  'maha|Matale|tomato':1.6, 'maha|Badulla|cabbage':1.5, 'maha|Jaffna|redonion':1.45,
  'maha|Monaragala|maize':1.4, 'maha|Kurunegala|brinjal':1.35, 'yala|Jaffna|redonion':1.5,
  'maha|Anuradhapura|bigonion':1.35, 'yala|Anuradhapura|chilli':1.3,
};
const CROP_BIAS = {greengram:.6, cowpea:.7, groundnut:.75};
const PRIVACY_K = 5;   // groups with fewer farmers are never shown (threshold-based aggregation)

let MARKET_BASE = null;
function buildMarket(){
  const M = {};
  for (const season of ['maha','yala']) for (const dn of DISTRICT_NAMES) for (const c of MARKET_CROPS){
    const key = `${season}|${dn}|${c.id}`;
    const r = mulberry32(hashStr(key));
    const s = suitability(c.id, {district:dn, season, soil:DISTRICTS[dn].soil, water:'minor'}).score;
    if (s < 40){ M[key] = {D:0, P:r()*4, k:r() < .5 ? 1 : 3}; continue; }
    const D = c.demand * 25 * (s/100) ** 2 * (0.7 + r() * 0.6);
    const ratio = HOTSPOTS[key] ? HOTSPOTS[key] * (0.95 + r() * 0.1) : (0.7 + r() * 0.5) * (CROP_BIAS[c.id] || 1);
    const P = D * ratio;
    const avgFarm = c.group === 'Grain' ? 2.2 : 1.1;
    const k = Math.max(0, Math.round(P / avgFarm * (0.8 + r() * 0.4)));
    M[key] = {D, P, k};
  }
  return M;
}
function satStatus(sat){
  if (sat < 0.85) return {label:'Under-supplied', cls:'st-under', short:'Opportunity'};
  if (sat <= 1.15) return {label:'Balanced', cls:'st-bal', short:'Balanced'};
  if (sat <= 1.4) return {label:'Crowded', cls:'st-crowd', short:'Crowded'};
  return {label:'Oversupply risk', cls:'st-over', short:'Oversupply'};
}
/** Aggregated market view for one crop in one district and season, including the user's own plans. */
function marketCell(season, district, cropId){
  const c = CROP[cropId];
  if (!c.market) return null;
  if (!MARKET_BASE) MARKET_BASE = buildMarket();
  const base = MARKET_BASE[`${season}|${district}|${cropId}`];
  let {D, P, k} = base;
  for (const p of (state?.plans || [])) if (p.season === season && p.district === district && p.crop === cropId){ P += p.acres; k += 1; }
  const suppressed = k < PRIVACY_K || D <= 0;
  const sat = D > 0 ? P / D : 0;
  // Simple inverse-demand curve: more supply than demand pushes the harvest price down.
  const price = suppressed ? c.price : c.price * clamp(1 - 0.55 * (sat - 1), 0.45, 1.45);
  return {D, P, k, sat, suppressed, price, ...(suppressed ? {label:'Not enough data', cls:'st-hidden', short:'Hidden'} : satStatus(sat))};
}
function contributors(season, district){
  let n = 0;
  for (const c of MARKET_CROPS){ const m = marketCell(season, district, c.id); if (!m.suppressed) n += m.k; }
  return n;
}
/** 12 months of illustrative price history (Oct 2025 → Sep 2026). */
function priceHistory(cropId){
  const c = CROP[cropId], r = mulberry32(hashStr('hist' + cropId)), ph = r() * 12;
  return Array.from({length:12}, (_, i) => Math.round(c.price * (1 + 0.16 * Math.sin((i + ph) / 12 * Math.PI * 2) + (r() - .5) * .08)));
}

/* ---- 2c. Profit-oriented ranking ----------------------------------- */
function economics(cropId, score, m, acres = 1){
  const c = CROP[cropId];
  const kg = c.yield * (0.45 + 0.55 * score / 100) * acres;
  const price = m ? m.price : c.price;
  const revenue = kg * price, cost = c.cost * acres;
  return {kg, price, revenue, cost, profit: revenue - cost};
}
/** Crops scoring ≥ 60 suitability, ranked by expected profit per acre at forecast prices. */
function rankCrops(inp, exclude){
  return MARKET_CROPS
    .filter(c => c.id !== exclude)
    .map(c => {
      const s = suitability(c.id, inp), m = marketCell(inp.season, inp.district, c.id);
      return {c, s, m, e: economics(c.id, s.score, m)};
    })
    .filter(x => x.s.score >= 60)
    .sort((a, b) => b.e.profit - a.e.profit);
}
/** Home-garden recommendations: sunlight and space constraints on top of climate suitability. */
function gardenPicks(district, space, sunHours){
  const season = currentSeason();
  return CROPS.filter(c => c.garden && (space !== 'pot' || c.garden === 'pot'))
    .map(c => {
      const s = suitability(c.id, {district, season, soil:'ALL', water:'well'});
      const sunFit = sunHours >= c.sun ? 1 : sunHours >= c.sun - 2 ? .7 : .4;
      return {c, score: Math.round(s.score * sunFit), s};
    })
    .sort((a, b) => b.score - a.score);
}

/* ---- 2d. Plant identification (feature extraction + prototype matching) ---- */
const ID_CLASSES = ['paddy','tomato','chilli','brinjal','cabbage','bigonion','maize','banana','pumpkin','carrot'];
const FEATURE_W = [1.4, 1.4, 2, 2, 2, 1, .6, .6];

function rgb2hsv(r, g, b){
  r/=255; g/=255; b/=255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
  let h = 0;
  if (d){ if (mx === r) h = ((g-b)/d) % 6; else if (mx === g) h = (b-r)/d + 2; else h = (r-g)/d + 4; h *= 60; if (h < 0) h += 360; }
  return [h, mx ? d/mx : 0, mx];
}
/** Colour-class fractions + edge density + mean brightness/saturation from a 64×64 downsample. */
function extractFeatures(src){
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const x = cv.getContext('2d', {willReadFrequently:true});
  x.drawImage(src, 0, 0, 64, 64);
  const px = x.getImageData(0, 0, 64, 64).data;
  const L = new Float32Array(4096);
  let green=0, blueGreen=0, red=0, purple=0, orange=0, sv=0, ss=0;
  for (let p = 0; p < 4096; p++){
    const r = px[p*4], g = px[p*4+1], b = px[p*4+2];
    const [h, s, v] = rgb2hsv(r, g, b);
    L[p] = (0.299*r + 0.587*g + 0.114*b) / 255; sv += v; ss += s;
    if ((h < 15 || h > 340) && s > .45 && v > .3) red++;
    else if (h >= 15 && h < 62 && s > .5 && v > .5) orange++;
    else if (h >= 62 && h < 140 && s > .2 && v > .15) green++;
    else if (h >= 140 && h < 200 && s > .12 && v > .2) blueGreen++;
    else if (h >= 250 && h <= 340 && s > .2 && v > .12) purple++;
  }
  let edges = 0;
  for (let y = 1; y < 63; y++) for (let xx = 1; xx < 63; xx++){
    const p = y*64 + xx;
    if (Math.hypot(L[p+1] - L[p-1], L[p+64] - L[p-64]) > .18) edges++;
  }
  const n = 4096;
  return [green/n, blueGreen/n, red/n, purple/n, orange/n, edges/3844, sv/n, ss/n];
}
let PROTOTYPES = null;   // learned per-class mean feature vectors
function trainPrototypes(){
  PROTOTYPES = {};
  for (const id of ID_CLASSES){
    const acc = new Array(8).fill(0);
    for (const seed of [1, 2, 3, 4]){ const f = extractFeatures(drawSample(id, seed)); f.forEach((v, i) => acc[i] += v / 4); }
    PROTOTYPES[id] = acc;
  }
}
/** Classify an image → sorted class probabilities, growth stage, and whether a plant was detected. */
function classify(src){
  if (!PROTOTYPES) trainPrototypes();
  const f = extractFeatures(src);
  const dists = ID_CLASSES.map(id => Math.sqrt(PROTOTYPES[id].reduce((a, v, i) => a + FEATURE_W[i] * (v - f[i]) ** 2, 0)));
  const mean = dists.reduce((a, b) => a + b, 0) / dists.length;
  const tau = Math.max(mean * .18, 1e-4);
  const ex = dists.map(d => Math.exp(-d / tau));
  const Z = ex.reduce((a, b) => a + b, 0);
  const probs = ID_CLASSES.map((id, i) => ({id, p: ex[i] / Z})).sort((a, b) => b.p - a.p);
  const plantFrac = f[0] + f[1], fruit = f[2] + f[3] + f[4];
  const stage = fruit > .04 ? 'Flowering / fruiting' : plantFrac < .3 ? 'Seedling' : 'Vegetative';
  return {probs, stage, plant: plantFrac >= .08, features: f};
}

/* Procedural sample images (also the training set for the prototypes). */
function drawSample(id, seed){
  const cv = document.createElement('canvas'); cv.width = cv.height = 200;
  const x = cv.getContext('2d'), r = mulberry32(hashStr(id) + seed * 7919);
  const g = x.createLinearGradient(0, 0, 0, 200); g.addColorStop(0, '#5e4330'); g.addColorStop(1, '#3f2c1f');
  x.fillStyle = g; x.fillRect(0, 0, 200, 200);
  for (let i = 0; i < 380; i++){ x.fillStyle = `rgba(${r()<.5?30:110},${r()<.5?20:80},14,${.2 + r()*.3})`; x.fillRect(r()*200, r()*200, 2, 2); }
  const ell = (cx, cy, rx, ry, rot, fill) => { x.save(); x.translate(cx, cy); x.rotate(rot); x.beginPath(); x.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2); x.fillStyle = fill; x.fill(); x.restore(); };
  const stroke = (pts, w, col) => { x.beginPath(); x.moveTo(pts[0], pts[1]); x.quadraticCurveTo(pts[2], pts[3], pts[4], pts[5]); x.lineWidth = w; x.strokeStyle = col; x.lineCap = 'round'; x.stroke(); };
  const hsl = (h, s, l) => `hsl(${h} ${s}% ${l}%)`;
  switch (id){
    case 'paddy':
      for (let i = 0; i < 95; i++){ const bx = r()*200, top = 10 + r()*70; stroke([bx, 200, bx + (r()-.5)*30, 110, bx + (r()-.5)*50, top], 2, hsl(95, 55, 42 + r()*18)); }
      for (let i = 0; i < 7; i++){ const px = 20 + r()*160, py = 20 + r()*40; stroke([px, py + 30, px + 8, py + 10, px + 18, py], 3, hsl(46, 72, 60)); }
      break;
    case 'tomato':
      for (let i = 0; i < 5; i++) stroke([30 + i*35, 200, 40 + i*35, 110, 25 + i*38, 30], 3, hsl(110, 40, 26));
      for (let i = 0; i < 26; i++) ell(20 + r()*160, 20 + r()*160, 20, 9, r()*3, hsl(108, 45, 30 + r()*10));
      for (let i = 0; i < 7; i++){ const cx = 30 + r()*140, cy = 60 + r()*110; ell(cx, cy, 11, 11, 0, hsl(5, 80, 47)); ell(cx - 3, cy - 4, 3, 2, 0, 'rgba(255,255,255,.5)'); }
      break;
    case 'chilli':
      for (let i = 0; i < 40; i++) ell(15 + r()*170, 15 + r()*170, 11, 5, r()*3, hsl(122, 50, 24 + r()*8));
      for (let i = 0; i < 14; i++) ell(20 + r()*160, 50 + r()*130, 3.5, 16, (r()-.5)*.8, r() < .65 ? hsl(0, 85, 45) : hsl(98, 60, 40));
      break;
    case 'brinjal':
      for (let i = 0; i < 10; i++) ell(20 + r()*160, 20 + r()*150, 40, 23, r()*3, hsl(100, 18, 38 + r()*8));
      for (let i = 0; i < 4; i++){ const cx = 35 + r()*130, cy = 80 + r()*90; ell(cx, cy, 14, 27, (r()-.5)*.6, hsl(285, 55, 24)); ell(cx, cy - 24, 9, 5, 0, hsl(110, 40, 30)); }
      break;
    case 'cabbage':
      for (const [cx, cy] of [[100, 105], [30, 30], [180, 190]]) for (let k = 6; k >= 0; k--) ell(cx, cy, 30 + k*12, 28 + k*11, 0, k ? hsl(150, 28, 52 + (6-k)*2.5) : hsl(80, 40, 74));
      x.strokeStyle = hsl(150, 20, 42); x.lineWidth = 1.5;
      for (let k = 1; k < 7; k++){ x.beginPath(); x.ellipse(100, 105, 30 + k*12, 28 + k*11, 0, 0, Math.PI*2); x.stroke(); }
      break;
    case 'bigonion':
      for (let i = 0; i < 34; i++){ const bx = 10 + r()*180; stroke([bx, 170, bx + (r()-.5)*14, 90, bx + (r()-.5)*24, 10 + r()*40], 4.5, hsl(165, 35, 42 + r()*10)); }
      for (let i = 0; i < 6; i++) ell(20 + i*32 + r()*8, 180, 16, 13, 0, hsl(330, 40, 55));
      break;
    case 'maize':
      for (let i = 0; i < 11; i++){ const bx = 20 + r()*160; stroke([bx, 200, bx + (r()-.5)*90, 110, bx + (r()-.5)*170, 20 + r()*80], 12, hsl(95, 55, 34 + r()*10)); }
      for (let i = 0; i < 2; i++){ const cx = 60 + i*80, cy = 100 + r()*30; ell(cx, cy, 13, 32, .3, hsl(48, 85, 55)); ell(cx - 8, cy + 6, 8, 30, .5, hsl(90, 45, 45)); }
      break;
    case 'banana':
      for (let i = 0; i < 6; i++){ const cx = 30 + r()*140, cy = 30 + r()*140, rot = r()*3; ell(cx, cy, 95, 38, rot, hsl(80, 58, 42 + r()*10)); x.save(); x.translate(cx, cy); x.rotate(rot); x.fillStyle = hsl(70, 45, 62); x.fillRect(-90, -1.5, 180, 3); x.restore(); }
      break;
    case 'pumpkin':
      for (let i = 0; i < 9; i++) ell(20 + r()*160, 20 + r()*160, 30, 28, 0, hsl(110, 45, 26 + r()*8));
      for (let i = 0; i < 2; i++) ell(50 + i*90 + r()*20, 120 + r()*40, 25, 21, 0, hsl(28, 90, 52));
      for (let i = 0; i < 3; i++){ const cx = 30 + r()*140, cy = 30 + r()*80; for (let p = 0; p < 5; p++) ell(cx + Math.cos(p*1.26)*8, cy + Math.sin(p*1.26)*8, 8, 5, p*1.26, hsl(50, 90, 58)); }
      break;
    case 'carrot':
      for (let t = 0; t < 5; t++){ const cx = 20 + t*40 + r()*10; for (let i = 0; i < 40; i++){ const a = -Math.PI/2 + (r()-.5)*2.2, len = 30 + r()*70; stroke([cx, 140, cx + Math.cos(a)*len*.5, 140 + Math.sin(a)*len*.5, cx + Math.cos(a)*len, 140 + Math.sin(a)*len], 1.3, hsl(115, 55, 36 + r()*14)); } }
      for (let t = 0; t < 3; t++){ const cx = 40 + t*60; x.beginPath(); x.moveTo(cx - 12, 142); x.lineTo(cx + 12, 142); x.lineTo(cx + 2, 198); x.closePath(); x.fillStyle = hsl(25, 90, 55); x.fill(); }
      break;
  }
  return cv;
}

function paintField(cv){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 130, h = cv.clientHeight || 110;
  cv.width = w * dpr; cv.height = h * dpr;
  const x = cv.getContext('2d'); x.scale(dpr, dpr);
  const r = mulberry32(42);
  for (let row = 0; row < 7; row++){
    const y = h * .25 + row * (h * .12), n = 6 + row * 2;
    for (let i = 0; i < n; i++){
      const px = w - (i + .5) * (w / n) * (1 + row * .08), s = 3 + row * 1.3;
      x.strokeStyle = `hsl(${88 + r()*20} 55% ${42 + r()*16}%)`; x.lineWidth = 1.2 + row * .25; x.lineCap = 'round';
      x.beginPath(); x.moveTo(px, y + s); x.quadraticCurveTo(px - s, y, px - s * 1.4, y - s * .6); x.stroke();
      x.beginPath(); x.moveTo(px, y + s); x.quadraticCurveTo(px + s, y, px + s * 1.4, y - s * .6); x.stroke();
    }
  }
}

/* ---------- alerts (FCM stand-in) ---------- */
function buildAlerts(){
  if (!state.user) return [];
  const u = state.user, season = currentSeason(), S = SEASONS[season];
  const out = [{tone:'info', title:`${S.long} sowing window`, body:`The ${S.monsoon} brings the main rains for ${S.months}. Prepare land and seed now.`}];
  if (u.role === 'farmer'){
    const cells = MARKET_CROPS.map(c => ({c, m:marketCell(season, u.district, c.id)})).filter(x => !x.m.suppressed);
    const over = cells.filter(x => x.m.sat > 1.4).sort((a, b) => b.m.sat - a.m.sat)[0];
    const opp = cells.filter(x => x.m.sat < .85 && suitability(x.c.id, {district:u.district, season, soil:DISTRICTS[u.district].soil, water:u.water}).score >= 60).sort((a, b) => a.m.sat - b.m.sat)[0];
    if (over) out.push({tone:'warn', title:`${over.c.name} is oversupplied in ${u.district}`, body:`Planned area is ${over.m.sat.toFixed(1)}× local demand. Forecast price ${lkr(over.m.price)}/kg vs ${lkr(over.c.price)} normally.`});
    if (opp) out.push({tone:'good', title:`Opportunity: ${opp.c.name}`, body:`Only ${pct(opp.m.sat)}% of expected demand is planted in ${u.district}. Forecast ${lkr(opp.m.price)}/kg.`});

  out.push({tone:'warn', title:`Heavy rain expected in ${u.district}`, body:'Sample weather alert: clear field drains and delay fertilizer application by 2 days.'});
  return out;
}

function dial(score, cls){

  return `<svg class="dial" viewBox="0 0 104 104" role="img" aria-label="Suitability ${score} out of 100">

    <circle cx="52" cy="52" r="${R}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C2 * score / 100} ${C2}" transform="rotate(-90 52 52)"/>
    <text x="52" y="56" text-anchor="middle" font-size="28">${score}</text><text class="sub" x="52" y="72" text-anchor="middle">/ 100</text></svg>`;

function priceChart(hist, fc){
  const W = 330, H = 150, pl = 44, pr = 14, pt = 12, pb = 26, n = hist.length + 2;
  const all = [...hist, fc], lo0 = Math.min(...all), hi0 = Math.max(...all);
  const step = Math.pow(10, Math.floor(Math.log10(Math.max(hi0 - lo0, 10)))) / (hi0 - lo0 > 400 ? 1 : 2);
  const lo = Math.floor(lo0 * .92 / step) * step, hi = Math.ceil(hi0 * 1.05 / step) * step;
  const X = i => pl + (W - pl - pr) * i / n, Y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const ticks = [lo, lo + (hi - lo) / 2, hi].map(v => Math.round(v));
  const pts = hist.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Price history and harvest forecast">
    ${ticks.map(t => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl - 6}" y="${Y(t) + 3}" text-anchor="end">${t}</text>`).join('')}
    <path class="area" d="M${pts.join(' L')} L${X(hist.length - 1)},${H - pb} L${X(0)},${H - pb} Z"/>
    <path class="ln" d="M${pts.join(' L')}"/>
    <path class="fc" d="M${X(hist.length - 1)},${Y(hist[hist.length - 1])} L${X(n)},${Y(fc)}"/>
    <circle class="enddot" cx="${X(hist.length - 1)}" cy="${Y(hist[hist.length - 1])}" r="3.5"/>
    <circle class="fcdot" cx="${X(n)}" cy="${Y(fc)}" r="4.5"/>
    <text x="${X(0)}" y="${H - 8}">Oct 25</text><text x="${X(hist.length - 1)}" y="${H - 8}" text-anchor="middle">Sep 26</text><text x="${X(n)}" y="${H - 8}" text-anchor="end">Harvest</text>
  </svg>`;
}
function openMarketDetail(cropId){

  openSheet(`
    <div class="row">${cropBadge(c)}<div class="grow"><h2>${esc(c.name)}</h2><span class="xs muted">${esc(f.district)} · ${SEASONS[f.season].long}</span></div>${pill(m.cls, m.label)}</div>

function readImage(file){
  if (!file.type.startsWith('image/')){ toast('That file is not an image. Choose a JPG or PNG photo.'); return; }
  const rd = new FileReader();
  rd.onload = () => { const img = new Image(); img.onload = () => runIdentify(img, 'Your photo'); img.onerror = () => toast('Could not read that image. Try another photo.'); img.src = rd.result; };
  rd.readAsDataURL(file);
}
function runIdentify(src, label){
  if (!useQuota('ids')) return;
  // Square-crop the source onto a working canvas (what gets classified and shown).
  const cv = document.createElement('canvas'); cv.width = cv.height = 224;
  const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height, s = Math.min(w, h);
  cv.getContext('2d').drawImage(src, (w - s) / 2, (h - s) / 2, s, s, 0, 0, 224, 224);
  const res = classify(cv);
  const top = res.probs[0], c = CROP[top.id], CONF = .45;
  let body;
  if (!res.plant){
    body = `<div class="callout warn">${icon('alert')}<span>No plant detected. Take the photo closer, in daylight, with leaves filling most of the frame.</span></div>`;
  } else {
    const sure = top.p >= CONF;
    body = `
      ${sure ? `<div class="row wrap"><h2>${esc(c.name)}</h2>${pill('st-under', pct(top.p) + '% match')}</div>`
             : `<div class="callout warn">${icon('alert')}<span>Low confidence (${pct(top.p)}%). The closest match is ${esc(c.name)}, but try a clearer photo showing leaves and fruit.</span></div>`}
      <div class="xs muted">Growth stage: <b>${res.stage}</b></div>
      <div class="stack" style="gap:6px">${res.probs.slice(0, 3).map(p => `<div class="prob"><span>${esc(CROP[p.id].name)}</span><div class="bar"><i style="width:${pct(p.p)}%"></i></div><span class="num xs">${pct(p.p)}%</span></div>`).join('')}</div>`;
  }
  $('#id-result').innerHTML = `
    <div class="card stack">
      <div class="idwrap"><canvas id="id-preview" width="224" height="224" aria-label="${esc(label)}"></canvas><div class="stack grow" style="gap:8px;min-width:0">${body}</div></div>
      ${res.plant ? `<p class="small"><b>Care tip:</b> ${esc(c.tip)}</p>
      <div id="fb" class="stack" style="gap:8px"><span class="small muted">Is this right?</span>
        <div class="row"><button class="btn sm soft grow" data-act="fbYes" data-crop="${top.id}">${icon('check')} Yes</button><button class="btn sm ghost grow" data-act="fbNo" data-crop="${top.id}">No, it's something else</button></div></div>` : ''}
    </div>`;
  $('#id-preview').getContext('2d').drawImage(cv, 0, 0);
  state.history.unshift({type:'id', crop:top.id, p:top.p, at:Date.now()}); state.history = state.history.slice(0, 20); save();
  $('#id-result').scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ---------- CHAT ---------- */
function screenChat(){
  $('#screen').innerHTML = `
    <div class="msgs" id="msgs">${state.chat.map(m => `<div class="msg ${m.from}">${m.html}</div>`).join('')}</div>
    <div class="composer">
      <div class="chips">${['What should I plant this season?','Price of green gram','Pests on chilli','Can I grow potato in Kandy?','Best plants for a balcony'].map(q => `<button class="chip" data-act="ask" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <form id="f-chat"><input id="chat-in" placeholder="Ask about crops, prices, pests…" autocomplete="off" aria-label="Message"><button class="btn" aria-label="Send">${icon('send')}</button></form>
    </div>`;
  const sc = $('#screen'); sc.scrollTop = sc.scrollHeight;
}
function sendChat(text){
  text = text.trim(); if (!text) return;
  state.chat.push({from:'me', html:`<p>${esc(text)}</p>`});
  const msgs = $('#msgs');
  msgs.insertAdjacentHTML('beforeend', `<div class="msg me"><p>${esc(text)}</p></div><div class="msg bot typing" id="typing"><span></span><span></span><span></span></div>`);
  $('#screen').scrollTop = $('#screen').scrollHeight;
  setTimeout(() => {
    const html = botReply(text);
    state.chat.push({from:'bot', html}); state.chat = state.chat.slice(-40); save();
    const t = $('#typing'); if (t){ t.classList.remove('typing'); t.removeAttribute('id'); t.innerHTML = html; }
    $('#screen').scrollTop = $('#screen').scrollHeight;
  }, 550);
}
/** Intent recognition → answers grounded in the suitability and market models. */
function botReply(raw){
  const m = raw.toLowerCase(), u = state.user;
  const crop = findCrop(m), district = findDistrict(m) || u.district, season = findSeason(m) || currentSeason();
  const inp = {district, season, soil:DISTRICTS[district].soil, water:u.water || 'minor'};
  const S = SEASONS[season];
  const cropRow = (c, right) => `<div class="li">${cropBadge(c)}<div class="grow"><div class="t">${esc(c.name)}</div></div><div class="right">${right}</div></div>`;

  if (/^(hi|hello|hey|ayubowan|vanakkam|good (morning|evening))\b/.test(m))
    return `<p>Hello ${esc(u.name)}! Ask me what to plant, how a crop is selling in your area, or how to handle a pest.</p>`;
  if (/(subscription|premium|basic plan|upgrade|my plan|free plan)/.test(m))
    return `<p>You're on the <b>${tier().name}</b> plan: ${tier().perks.join(', ').toLowerCase()}.</p><p><button class="link" data-act="openUpgrade">Compare plans</button></p>`;
  if (/(balcony|pot|rooftop|home garden|kitchen garden|garden)/.test(m)){
    const g = gardenPicks(district, /yard/.test(m) ? 'yard' : 'pot', 6).slice(0, 4);
    return `<p>For pots or a balcony in ${esc(district)} with good sun, these do well:</p><div class="list">${g.map(x => cropRow(x.c, pill(suitLabel(x.score).cls, x.score + '/100'))).join('')}</div><p class="xs muted">Use pots at least 30 cm deep for tomato and brinjal.</p>`;
  }
  if (/(price|market|demand|sell|oversuppl|saturat|glut)/.test(m)){
    if (crop && CROP[crop].market){
      const mk = marketCell(season, district, crop), c = CROP[crop];
      if (mk.suppressed) return `<p>Too few farmers have shared ${esc(c.name)} plans in ${esc(district)} for ${S.long} to show a trend. Typical price is about ${lkr(c.price)}/kg.</p>`;
      return `<p><b>${esc(c.name)} in ${esc(district)}, ${S.long}</b></p><p>${pill(mk.cls, mk.label)} ${Math.round(mk.P)} acres planned against about ${Math.round(mk.D)} acres of local demand.</p><p>Forecast harvest price: <b>${lkr(mk.price)}/kg</b> (typical ${lkr(c.price)}).</p>${mk.sat > 1.4 ? '<p>Consider a less crowded crop or staggering your planting date.</p>' : ''}`;
    }
    const cells = MARKET_CROPS.map(c => ({c, mk:marketCell(season, district, c.id)})).filter(x => !x.mk.suppressed);
    const over = cells.filter(x => x.mk.sat > 1.15).sort((a, b) => b.mk.sat - a.mk.sat).slice(0, 3);
    const opp = cells.filter(x => x.mk.sat < .85).sort((a, b) => a.mk.sat - b.mk.sat).slice(0, 3);
    return `<p><b>Market pulse · ${esc(district)} · ${S.long}</b></p>${over.length ? `<p>Crowded:</p><div class="list">${over.map(x => cropRow(x.c, pill(x.mk.cls, x.mk.sat.toFixed(1) + '×'))).join('')}</div>` : ''}${opp.length ? `<p>Room to grow:</p><div class="list">${opp.map(x => cropRow(x.c, pill(x.mk.cls, pct(x.mk.sat) + '%'))).join('')}</div>` : ''}`;
  }
  if (/(fertili[sz]|manure|urea|npk|compost|nutrient)/.test(m)){
    const c = crop ? CROP[crop] : null;
    return `<p>${c ? `For <b>${esc(c.name)}</b>: ` : ''}work in compost or well-rotted manure before planting, give a basal dose at planting, and follow with top dressings during growth.</p><p>Exact amounts depend on your soil, so get a soil test and use the Department of Agriculture recommendation for ${esc(ZONE_NAME[DISTRICTS[district].z].toLowerCase())}. Don't apply fertilizer just before heavy rain.</p>`;
  }
  if (/(pest|disease|insect|worm|bug|fung|blight|curl|spots?|rot|wilt|mite|thrip|aphid)/.test(m)){
    const c = crop ? CROP[crop] : null;
    return `${c ? `<p><b>${esc(c.name)}:</b> ${esc(c.pest)}</p>` : ''}<p>General approach: scout the field weekly, remove badly affected plants, keep weeds down, and rotate crops. Use pesticides only when damage passes the threshold, and follow the label.</p><p>If you have a photo, use <button class="link" data-act="goto" data-tab="identify">Identify</button> to confirm the crop first.</p>`;
  }
  if (/(water|irrigat|drought|how much rain|watering)/.test(m)){
    const d = DISTRICTS[district], c = crop ? CROP[crop] : null;
    return `<p>${esc(district)} gets about <b>${d[season]} mm</b> during ${S.long}${c ? `, and ${esc(c.name)} needs ${c.rain[0]}–${c.rain[1]} mm over its season` : ''}.</p><p>${c && d[season] < c.rain[0] ? `You'll need about ${c.rain[0] - d[season]} mm more from irrigation. A minor tank or agro-well usually covers this.` : 'Water early in the morning and mulch to cut evaporation.'}</p>`;
  }
  if (crop && /(suitab|grow|can i|good for|possible|ok to|okay to)/.test(m)){
    const s = suitability(crop, inp), c = CROP[crop], mk = marketCell(season, district, crop);
    return `<p><b>${esc(c.name)} in ${esc(district)}, ${S.name}:</b> ${pill(s.cls, s.label + ' · ' + s.score)}</p><p>Weakest factor: ${esc(s.factors.slice().sort((a, b) => a.v - b.v)[0].name.toLowerCase())} (${esc(s.factors.slice().sort((a, b) => a.v - b.v)[0].note)}).</p>${mk && !mk.suppressed ? `<p>Market: ${pill(mk.cls, mk.label)}</p>` : ''}<p><button class="link" data-act="checkCrop" data-crop="${crop}">Open full analysis</button></p>`;
  }
  if (/(when|season|maha|yala|sow|planting time)/.test(m) && !/(what|which).*(grow|plant|crop)/.test(m)){
    const c = crop ? CROP[crop] : null;
    const pref = c ? (c.season.maha >= c.season.yala ? 'maha' : 'yala') : null;
    return `<p><b>Maha</b> runs October to March with the North-East monsoon; <b>Yala</b> runs April to September with the South-West monsoon.</p>${c ? `<p>${esc(c.name)} does best in <b>${SEASONS[pref].name}</b> in most areas. Crop duration: ${esc(c.days)}.</p>` : `<p>The upcoming season is ${SEASONS[currentSeason()].long}.</p>`}`;
  }
  if (/(what|which|best|recommend|suggest|should).*(grow|plant|crop|cultivat)|recommend|suggest/.test(m)){
    const r = rankCrops(inp).slice(0, 4);
    if (!r.length) return `<p>No crop scores well enough in ${esc(district)} for ${S.long} with ${WATER[inp.water].name.toLowerCase()}. Adding irrigation widens the options.</p>`;
    return `<p>Best-paying crops for <b>${esc(district)}, ${S.long}</b> that also suit the land:</p><div class="list">${r.map(x => cropRow(x.c, pill(x.m.cls, x.s.score + ' · ' + x.m.short))).join('')}</div><p class="xs muted">Ranked by expected profit per acre, using forecast prices from other farmers' plans.</p>`;
  }
  if (crop){
    const c = CROP[crop], s = suitability(crop, inp), mk = marketCell(season, district, crop);
    return `<p><b>${esc(c.name)}</b> · ${esc(c.days)}</p><p>${esc(c.tip)}</p><p>In ${esc(district)} this ${S.name}: ${pill(s.cls, s.label)} ${mk && !mk.suppressed ? pill(mk.cls, mk.label) : ''}</p>`;
  }
  return `<p>I can help with:</p><div class="chips"><button class="chip" data-act="ask" data-q="What should I plant this season?">What to plant</button><button class="chip" data-act="ask" data-q="Market pulse">Market pulse</button><button class="chip" data-act="ask" data-q="Fertilizer for paddy">Fertilizer</button><button class="chip" data-act="ask" data-q="When is Yala season?">Seasons</button></div><p class="xs muted">Try naming a crop and a district, e.g. "tomato in Matale".</p>`;
}

/* ---------- SHEETS: profile, upgrade, alerts, register ---------- */
function openProfile(){
  if (!state.user){ toast('Sign in first, or try a demo profile.'); return; }
  const u = state.user, t = tier();
  const q = (used, lim) => `<b class="num">${used} / ${lim === Infinity ? '∞' : lim}</b>`;
  openSheet(`
    <div class="row"><span class="iconbtn avatar" style="width:48px;height:48px;font-size:20px">${esc(u.name[0].toUpperCase())}</span><div class="grow"><h2>${esc(u.name)}</h2><span class="xs muted">${esc(u.phone)} · ${u.role === 'farmer' ? 'Farmer' : 'Home gardener'} · ${esc(u.district)}</span></div></div>
    <div class="card stack"><div class="section-h"><h2>${t.name} plan</h2><button class="link" data-act="openUpgrade">Change</button></div>
      <div class="quota"><div class="tile"><span>Crop checks today</span>${q(state.usage.checks, t.checks)}</div><div class="tile"><span>Plant IDs today</span>${q(state.usage.ids, t.ids)}</div></div></div>
    <div class="field"><span class="lbl">Mode</span><div class="seg">
      <label><input type="radio" name="pr-role" value="farmer" ${u.role === 'farmer' ? 'checked' : ''} data-act="setRole"><span>Farmer</span></label>
      <label><input type="radio" name="pr-role" value="gardener" ${u.role === 'gardener' ? 'checked' : ''} data-act="setRole"><span>Home gardener</span></label></div></div>
    <div class="grid2">
      <div class="field"><label for="pr-district">Home district</label><select id="pr-district">${DISTRICT_NAMES.map(d => `<option ${d === u.district ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
      <div class="field"><label for="pr-water">Water source</label><select id="pr-water">${Object.entries(WATER).map(([k, w]) => `<option value="${k}" ${k === u.water ? 'selected' : ''}>${w.name}</option>`).join('')}</select></div></div>
    <p class="xs muted">${state.plans.length} season plans shared · ${state.feedback.length} ID corrections · data saved on this device for offline use.</p>
    <div class="row"><button class="btn ghost grow" data-act="signOut">Sign out</button><button class="btn grow" data-act="saveProfile">Save</button></div>
    <button class="link" data-act="resetAll" style="align-self:center">Reset all demo data</button>`);
}
function openUpgrade(reason){
  openSheet(`
    <h2>Choose a plan</h2>
    ${reason ? `<div class="callout info">${icon('info')}<span class="small">${esc(reason)}</span></div>` : ''}
    ${Object.entries(TIERS).map(([k, t]) => `
      <div class="tier ${state.tier === k ? 'cur' : ''}"><div class="row"><b class="grow" style="font-family:var(--display);font-size:17px">${t.name}</b><span class="num small">${t.price}</span></div>
        <ul>${t.perks.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
        ${state.tier === k ? '<span class="xs" style="color:var(--leaf);font-weight:700">Current plan</span>' : `<button class="btn sm" data-act="setTier" data-tier="${k}">Switch to ${t.name}</button>`}</div>`).join('')}
    <p class="xs muted">Example pricing. Switching is simulated in this prototype and no payment is taken.</p>`);
}
function openAlerts(){
  openSheet(`<h2>Alerts</h2>${buildAlerts().map(a => `<div class="callout ${a.tone}">${icon(a.tone === 'warn' ? 'alert' : a.tone === 'good' ? 'check' : 'info')}<div><b>${esc(a.title)}</b><br><span class="xs">${esc(a.body)}</span></div></div>`).join('')}<button class="btn ghost" data-act="closeSheet">Close</button>`);
}
function openRegister(){
  const {crop, acres} = state.lastPlan, f = state.form;
  openSheet(`
    <h2>Add ${esc(CROP[crop].name)} to your season plan</h2>
    <p class="small muted">${esc(f.district)} · ${SEASONS[f.season].long}. Only the district, crop and acreage are counted, never your name or exact location.</p>
    <form id="f-register" class="stack"><div class="field"><label for="r-acres">Acres you'll plant</label><input id="r-acres" type="number" min="0.1" step="0.1" value="${acres}"></div>
      <button class="btn block">Add to plan</button></form>`);
}

/* ---------- actions (event delegation) ---------- */
const ACTIONS = {
  goto(d){ if (!state.user){ toast('Sign in first, or try a demo profile.'); return; } closeSheet(); state.tab = d.tab; save(); render(); $('#screen').scrollTop = 0; },
  demoLogin(d){ closeSheet(); signIn({...DEMO_USERS[d.who]}); toast(`Signed in as ${DEMO_USERS[d.who].name} (demo)`); },
  resetAll(){ try { localStorage.removeItem(STORE_KEY); } catch (e) {} state = freshState(); closeSheet(); render(); toast('Demo reset'); },
  loginBack(){ state.loginStep = 'phone'; render(); },
  closeSheet, openProfile, openAlerts,
  openUpgrade(){ openUpgrade(); },
  setTier(d){ state.tier = d.tier; save(); closeSheet(); render(); toast(`You're now on ${TIERS[d.tier].name} (demo)`); },
  checkCrop(d){
    closeSheet();
    if (state.user.role === 'gardener'){ state.tab = 'plan'; render(); return; }
    state.form.crop = d.crop; state.tab = 'plan';
    if (!useQuota('checks')){ render(); return; }
    state.lastPlan = {crop:d.crop, acres:state.form.acres}; save(); render();
    requestAnimationFrame(() => $('#plan-result')?.scrollIntoView({behavior:'smooth'}));
  },
  registerPlan: openRegister,
  marketDetail(d){ openMarketDetail(d.crop); },
  sampleId(d){ runIdentify(drawSample(d.crop, 11), `Sample ${CROP[d.crop].name}`); },
  fbYes(d){ state.feedback.push({predicted:d.crop, actual:d.crop, at:Date.now()}); save(); $('#fb').innerHTML = `<div class="callout good">${icon('check')}<span class="small">Thanks. Confirmations help keep the model accurate.</span></div>`; },
  fbNo(d){
    $('#fb').innerHTML = `<div class="field"><label for="fb-sel">What is it?</label><select id="fb-sel">${CROPS.filter(c => c.id !== d.crop).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}<option value="other">Something else</option></select></div>
      <button class="btn sm" data-act="fbSend" data-crop="${d.crop}">Send correction</button>`;
  },
  fbSend(d){ state.feedback.push({predicted:d.crop, actual:$('#fb-sel').value, at:Date.now()}); save(); $('#fb').innerHTML = `<div class="callout good">${icon('check')}<span class="small">Correction saved. It will be used when the model is next retrained.</span></div>`; },
  ask(d){ if (state.tab !== 'chat'){ state.tab = 'chat'; render(); } sendChat(d.q); },
  signOut(){ state.user = null; state.chat = []; state.lastPlan = null; closeSheet(); save(); render(); },
  saveProfile(){
    const u = state.user;
    u.role = document.querySelector('input[name="pr-role"]:checked').value;
    u.district = $('#pr-district').value; u.water = $('#pr-water').value;
    state.form.district = u.district; state.form.water = u.water; state.lastPlan = null;
    save(); closeSheet(); render(); toast('Profile saved');
  },
  setRole(){},
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  if (a.tagName === 'INPUT') return;          // radios handled on save
  const fn = ACTIONS[a.dataset.act]; if (fn){ e.preventDefault(); fn(a.dataset, a); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id, f = state.form;
  if (id === 'f-phone'){
    const digits = $('#phone').value.replace(/\D/g, '');
    if (digits.length < 9){ toast('Enter a 10-digit mobile number, e.g. 077 123 4567'); return; }
    state.phone = $('#phone').value.trim(); state.loginStep = 'otp'; render(); $('#otp')?.focus();
  } else if (id === 'f-otp'){
    if ($('#otp').value.trim() !== '123456'){ toast('That code is not right. In this prototype the code is 123456.'); return; }
    state.loginStep = 'onboard'; render();
  } else if (id === 'f-onboard'){
    const name = $('#ob-name').value.trim() || 'Farmer';
    signIn({name, phone:state.phone, role:document.querySelector('input[name="role"]:checked').value,
            district:$('#ob-district').value, acres:Math.max(.1, +$('#ob-acres').value || 1), water:$('#ob-water').value, space:'pot', sun:6});
  } else if (id === 'f-plan'){
    Object.assign(f, {crop:$('#p-crop').value, district:$('#p-district').value, season:document.querySelector('input[name="p-season"]:checked').value,
                      soil:$('#p-soil').value, water:$('#p-water').value, acres:Math.max(.1, +$('#p-acres').value || 1)});
    if (!useQuota('checks')) return;
    state.lastPlan = {crop:f.crop, acres:f.acres};
    state.history.unshift({type:'check', crop:f.crop, at:Date.now()}); state.history = state.history.slice(0, 20);
    save(); render(); requestAnimationFrame(() => $('#plan-result')?.scrollIntoView({behavior:'smooth'}));
  } else if (id === 'f-register'){
    const acres = Math.max(.1, +$('#r-acres').value || 1);
    state.plans.push({crop:state.lastPlan.crop, district:f.district, season:f.season, acres, at:Date.now()});
    save(); closeSheet(); render(); toast(`Added ${acres} ac of ${CROP[state.lastPlan.crop].name}. It now counts in ${f.district}'s planting data.`);
  } else if (id === 'f-chat'){
    const v = $('#chat-in').value; $('#chat-in').value = ''; sendChat(v);
  }
});
// Live-updating selects on Market and Garden screens.
document.addEventListener('change', e => {
  const t = e.target, f = state.form; if (!f) return;
  if (t.id === 'm-district'){ f.district = t.value; save(); screenMarket(); }
  else if (t.name === 'm-season'){ f.season = t.value; save(); screenMarket(); }
  else if (t.id === 'g-district'){ f.district = t.value; save(); screenGarden(); }
  else if (t.name === 'g-space'){ f.space = t.value; save(); screenGarden(); }
  else if (t.name === 'g-sun'){ f.sun = +t.value; save(); screenGarden(); }
  else if (t.id === 'p-district'){  // refresh "typical soil" label
    f.district = t.value; const opt = $('#p-soil option[value="auto"]'); if (opt) opt.textContent = `Not sure · use typical for district (${SOILS[DISTRICTS[t.value].soil]})`;
  }
});
window.addEventListener('online', renderChrome);
window.addEventListener('offline', renderChrome);

load();
render();
</script>
