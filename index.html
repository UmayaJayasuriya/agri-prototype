<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgrI Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <style>
  :root{
    --ground:#e7ece3; --app:#f2f5ee; --panel:#ffffff; --panel-2:#eaf0e5;
    --ink:#1b2317; --ink-2:#56614f; --line:#d3dbcb;
    --leaf:#2d6a39; --leaf-soft:#dbeada; --on-leaf:#ffffff;
    --turmeric:#b87c0c; --turmeric-soft:#f6e8c9;
    --clay:#b1452a; --clay-soft:#f5ddd4;
    --sky:#2b6a8a; --sky-soft:#dbe9f0;
    --loam:#3a2c21;
    --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
    --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --r:14px;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --ground:#0e110d; --app:#141812; --panel:#1b2019; --panel-2:#222820;
    --ink:#e6ebde; --ink-2:#a2ac98; --line:#30372c;
    --leaf:#7fc48c; --leaf-soft:#1e3322; --on-leaf:#0d1a10;
    --turmeric:#e7b54a; --turmeric-soft:#3a2f16;
    --clay:#ef8c6e; --clay-soft:#3e231b;
    --sky:#82bbd8; --sky-soft:#18303b;
    --loam:#2a2119; color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --ground:#0e110d; --app:#141812; --panel:#1b2019; --panel-2:#222820;
    --ink:#e6ebde; --ink-2:#a2ac98; --line:#30372c;
    --leaf:#7fc48c; --leaf-soft:#1e3322; --on-leaf:#0d1a10;
    --turmeric:#e7b54a; --turmeric-soft:#3a2f16;
    --clay:#ef8c6e; --clay-soft:#3e231b;
    --sky:#82bbd8; --sky-soft:#18303b;
    --loam:#2a2119; color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
  h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
  p{margin:0}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .stage{height:100%;display:flex;justify-content:center}
  .device{width:100%;max-width:520px;height:100%;background:var(--app);position:relative;overflow:hidden;border-inline:1px solid var(--line)}
  .app{position:absolute;inset:0;display:flex;flex-direction:column}
  .appbar{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;background:var(--app)}
  .brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:var(--leaf);color:var(--on-leaf);display:grid;place-items:center}
  .brand i{font-style:normal;color:var(--turmeric)}
  .spacer{flex:1}
  .iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;position:relative}
  .iconbtn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--clay)}
  .avatar{font-family:var(--display);font-weight:700;background:var(--leaf-soft);color:var(--leaf);border-color:transparent}
  .offline{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--turmeric-soft);color:var(--turmeric)}
  .screen{flex:1;overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  .screen.chatmode{padding-bottom:0}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel);padding:6px 4px 8px}
  .tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-2);padding:6px 0;cursor:pointer;border-radius:10px}
  .tab svg{width:22px;height:22px}
  .tab[aria-current="page"]{color:var(--leaf)}
  .tab[aria-current="page"] svg{stroke-width:2.3}
  svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .section-h h2{font-size:17px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
  .muted{color:var(--ink-2)}
  .small{font-size:13px}
  .xs{font-size:12px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:10px}
  .row.wrap{flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--leaf);color:var(--on-leaf);display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn.block{width:100%}
  .btn.ghost{background:transparent;color:var(--leaf);border:1px solid var(--line)}
  .btn.soft{background:var(--leaf-soft);color:var(--leaf)}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .link{background:none;border:0;padding:0;color:var(--leaf);font-weight:700;cursor:pointer;font-size:13px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label,.field .lbl{font-size:12px;font-weight:700;color:var(--ink-2)}
  .field input,.field select{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;background:var(--panel-2);border-radius:11px;padding:3px;gap:3px}
  .seg label{flex:1;text-align:center;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-2)}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg input:checked+span{color:var(--ink)}
  .seg label:has(input:checked){background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.12);color:var(--ink)}
  .seg label:has(input:focus-visible){outline:2px solid var(--leaf)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .st-under{background:var(--leaf-soft);color:var(--leaf)}
  .st-bal{background:var(--sky-soft);color:var(--sky)}
  .st-crowd{background:var(--turmeric-soft);color:var(--turmeric)}
  .st-over{background:var(--clay-soft);color:var(--clay)}
  .st-hidden{background:var(--panel-2);color:var(--ink-2)}
  .hello h1{font-size:26px;letter-spacing:-.02em}
  .season{background:var(--loam);color:#f3ecdf;border-radius:18px;padding:16px;position:relative;overflow:hidden}
  .season .eyebrow{color:#d9c9a8}
  .season h2{font-size:20px;margin-top:4px}
  .season p{color:#e6dcc8;font-size:13px;margin-top:6px;max-width:30ch}
  .season canvas{position:absolute;right:-8px;bottom:-8px;width:130px;height:110px;opacity:.9}
  .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .qa{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .qa .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--leaf-soft);color:var(--leaf)}
  .qa:nth-child(2) .ic{background:var(--turmeric-soft);color:var(--turmeric)}
  .qa:nth-child(3) .ic{background:var(--sky-soft);color:var(--sky)}
  .qa:nth-child(4) .ic{background:var(--clay-soft);color:var(--clay)}
  .qa b{font-size:14px}
  .qa span{font-size:12px;color:var(--ink-2)}
  .list{display:flex;flex-direction:column}
  .li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
  .li:first-child{border-top:0}
  button.li{cursor:pointer}
  .li .t{font-weight:700}
  .li .s{font-size:12px;color:var(--ink-2)}
  .crop-ic{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px}
  .right{text-align:right;flex-shrink:0}
  .result-head{display:flex;gap:14px;align-items:center}
  .dial{width:104px;height:104px;flex-shrink:0}
  .dial .trk{stroke:var(--panel-2)}
  .dial text{fill:var(--ink);font-family:var(--display);font-weight:800}
  .dial .sub{fill:var(--ink-2);font-family:var(--body);font-weight:600;font-size:10px}
  .factor{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:13px}
  .bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;background:var(--leaf)}
  .bar>i.mid{background:var(--turmeric)}
  .bar>i.low{background:var(--clay)}
  .factor .note{grid-column:1/-1;font-size:11.5px;color:var(--ink-2);margin-top:-6px}
  .econ{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .econ div{background:var(--panel);padding:10px}
  .econ b{display:block;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .econ span{font-size:11.5px;color:var(--ink-2)}
  .econ .pos{color:var(--leaf)} .econ .neg{color:var(--clay)}
  .callout{border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
  .callout.warn{background:var(--clay-soft);color:var(--ink)}
  .callout.good{background:var(--leaf-soft);color:var(--ink)}
  .callout.info{background:var(--sky-soft);color:var(--ink)}
  .callout svg{flex-shrink:0;margin-top:1px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
  .tile b{display:block;font-family:var(--display);font-size:22px}
  .tile span{font-size:11px;color:var(--ink-2);font-weight:600}
  .satbar{position:relative;height:8px;border-radius:99px;background:var(--panel-2);margin-top:6px}
  .satbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
  .satbar .ref{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);opacity:.6}
  .locked{position:relative}
  .locked .veil{filter:blur(4px);pointer-events:none;user-select:none}
  .lockmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px}
  .lockmsg .card{box-shadow:0 10px 30px -10px rgba(0,0,0,.3)}
  .chart text{fill:var(--ink-2);font-size:10px;font-family:var(--mono)}
  .chart .grid{stroke:var(--line)}
  .chart .ln{stroke:var(--leaf);fill:none;stroke-width:2}
  .chart .area{fill:var(--leaf);opacity:.12}
  .chart .fc{stroke:var(--turmeric);stroke-dasharray:4 4;fill:none;stroke-width:2}
  .chart .fcdot{fill:var(--turmeric)}
  .chart .enddot{fill:var(--leaf)}
  .regbar{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;font-size:12.5px}
  .drop{border:1.5px dashed var(--line);border-radius:16px;padding:16px;text-align:center;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
  .drop.over{border-color:var(--leaf);background:var(--leaf-soft)}
  .samples{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .sample{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:4px;cursor:pointer;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-2)}
  .sample img{width:58px;height:58px;border-radius:9px;display:block}
  .idwrap{display:flex;gap:12px;align-items:flex-start}
  .idwrap canvas{width:112px;height:112px;border-radius:12px;flex-shrink:0;background:var(--panel-2)}
  .prob{display:grid;grid-template-columns:84px 1fr 38px;gap:8px;align-items:center;font-size:12.5px}
  .msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
  .msg{max-width:86%;padding:10px 12px;border-radius:16px;font-size:14px}
  .msg.me{align-self:flex-end;background:var(--leaf);color:var(--on-leaf);border-bottom-right-radius:5px}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.bot .li{padding:7px 0}
  .msg p+p{margin-top:6px}
  .typing span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--ink-2);animation:bl 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
  .composer{position:sticky;bottom:0;background:var(--app);padding:10px 0 12px;display:flex;flex-direction:column;gap:8px;margin-top:auto}
  .composer form{display:flex;gap:8px}
  .composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:11px 14px}
  .composer .btn{border-radius:99px;padding:0 16px}
  .sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
  .sheet-back{position:absolute;inset:0;background:rgba(10,14,8,.45)}
  .sheet-body{position:relative;background:var(--app);border-radius:22px 22px 0 0;max-height:88%;overflow-y:auto;padding:10px 16px 20px;display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
  .sheet-body .grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 2px}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  .toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:30;background:var(--ink);color:var(--app);padding:11px 14px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
  .tier{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
  .tier.cur{border-color:var(--leaf)}
  .tier ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
  .quota{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .login{padding:26px 22px;display:flex;flex-direction:column;gap:16px;flex:1;overflow-y:auto}
  .login .hero{background:var(--loam);border-radius:22px;padding:22px 18px;color:#f3ecdf;position:relative;overflow:hidden;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end}
  .login .hero h1{font-size:40px;letter-spacing:-.03em;font-weight:800}
  .login .hero h1 i{font-style:normal;color:#e9b44c}
  .login .hero p{color:#e2d7c2;font-size:14px;max-width:26ch;margin-top:4px;position:relative}
  .login .hero canvas{position:absolute;right:0;top:0;width:100%;height:100%;opacity:.55}
  .login .hero > *:not(canvas){position:relative}
  .demo-hint{font-family:var(--mono);font-size:12px;background:var(--turmeric-soft);color:var(--ink);padding:6px 10px;border-radius:8px}
  .divider{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:12px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  @media (max-width:520px){.device{border-inline:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
<div class="stage">
  <section class="device" aria-label="AgrI mobile app prototype">
    <div class="app" id="app">
      <header class="appbar" id="appbar" hidden></header>
      <main class="screen" id="screen"></main>
      <nav class="tabbar" id="tabbar" hidden aria-label="Main"></nav>
      <div class="sheet" id="sheet" hidden></div>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
  </section>
</div>

<script>
"use strict";

var DISTRICTS = {

  Monaragala:  {z:"I",e:"L",maha:1100,yala:450, t:27,  soil:"RBE"},
  Hambantota:  {z:"D",e:"L",maha:700, yala:350, t:28,  soil:"RBE"},
  Anuradhapura:{z:"D",e:"L",maha:900, yala:350, t:28,  soil:"RBE"},
  Polonnaruwa: {z:"D",e:"L",maha:1100,yala:300, t:28.5,soil:"RBE"},
  Ampara:      {z:"D",e:"L",maha:1300,yala:300, t:28,  soil:"LHG"},
  Batticaloa:  {z:"D",e:"L",maha:1400,yala:250, t:28.5,soil:"SR"},
  Trincomalee: {z:"D",e:"L",maha:1100,yala:250, t:29,  soil:"RBE"},
  Vavuniya:    {z:"D",e:"L",maha:1000,yala:300, t:28.5,soil:"RBE"},
  Mannar:      {z:"D",e:"L",maha:700, yala:200, t:29,  soil:"SR"},
  Kilinochchi: {z:"D",e:"L",maha:1000,yala:250, t:28.5,soil:"RYL"},
  Mullaitivu:  {z:"D",e:"L",maha:1100,yala:250, t:28.5,soil:"RBE"},
  Jaffna:      {z:"D",e:"L",maha:900, yala:150, t:29,  soil:"RYL"}
};
var DISTRICT_NAMES = Object.keys(DISTRICTS).sort();
var ZONE_NAME = {W:"Wet zone", I:"Intermediate zone", D:"Dry zone"};
var ELEV_NAME = {L:"Low country", M:"Mid country", U:"Up country"};
var SOILS = {
  RBE:"Reddish Brown Earth", LHG:"Low Humic Gley", RYP:"Red-Yellow Podzolic",
  ALL:"Alluvial", SR:"Sandy Regosol", RYL:"Red-Yellow Latosol"
};
var WATER = {
  rain:{name:"Rain-fed only", add:0},
  well:{name:"Agro-well / hand watering", add:250},
  minor:{name:"Minor tank", add:400},
  major:{name:"Major irrigation scheme", add:700}
};
var SEASONS = {
  maha:{name:"Maha", long:"Maha 2026/27", months:"Oct-Mar", monsoon:"North-East monsoon"},
  yala:{name:"Yala", long:"Yala 2027", months:"Apr-Sep", monsoon:"South-West monsoon"}
};

var C = function(id, name, o){ return Object.assign({id:id, name:name, market:true}, o); };
var CROPS = [

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

var FACTOR_WEIGHTS = {zone:.10, elev:.20, temp:.25, water:.25, soil:.12, season:.08};

function rangeScore(v, pair, perUnit){
  var lo = pair[0], hi = pair[1];
  if (v >= lo && v <= hi) return 1;
  var d = v < lo ? lo - v : v - hi;
  return clamp(1 - d * perUnit, 0, 1);
}
function waterScore(w, pair){
  var lo = pair[0], hi = pair[1];
  if (w >= lo && w <= hi) return 1;
  if (w < lo) return clamp(1 - (lo - w) / lo * 1.5, 0, 1);
  return clamp(1 - (w - hi) / hi * 0.8, 0.2, 1);
}

function suitability(cropId, inp){
  var c = CROP[cropId], d = DISTRICTS[inp.district];
  var temp = d.t + (inp.season === "maha" ? -0.8 : 0.6);
  var water = d[inp.season] + WATER[inp.water].add;
  var f = {
    zone:  c.zone[d.z] || .3,
    elev:  c.elev[d.e] || .3,
    temp:  rangeScore(temp, c.temp, .2),
    water: waterScore(water, c.rain),
    soil:  c.soil[inp.soil] || .4,
    season:c.season[inp.season] || .7
  };
  var score = 0;
  for (var k in FACTOR_WEIGHTS) score += FACTOR_WEIGHTS[k] * f[k];
  var minF = Math.min(f.zone, f.elev, f.temp, f.water, f.soil, f.season);
  score = Math.round(score * (0.6 + 0.4 * minF) * 100);
  var factors = [
    {k:"zone",  name:"Climate zone", v:f.zone,  note:ZONE_NAME[d.z]},
    {k:"elev",  name:"Elevation",    v:f.elev,  note:ELEV_NAME[d.e]},
    {k:"temp",  name:"Temperature",  v:f.temp,  note:temp.toFixed(1) + " deg C season mean (ideal: " + c.temp[0] + "-" + c.temp[1] + " deg C)"},
    {k:"water", name:"Water",        v:f.water, note:water + " mm rain + irrigation (needs: " + c.rain[0] + "-" + c.rain[1] + " mm)"},
    {k:"soil",  name:"Soil",         v:f.soil,  note:SOILS[inp.soil]},
    {k:"season",name:"Season fit",   v:f.season,note:SEASONS[inp.season].name + " (" + SEASONS[inp.season].months + ")"}
  ];
  return Object.assign({score:score, factors:factors}, suitLabel(score));
}
function suitLabel(s){
  if (s >= 75) return {label:"Highly suitable", cls:"st-under"};
  if (s >= 60) return {label:"Suitable", cls:"st-bal"};
  if (s >= 45) return {label:"Marginal", cls:"st-crowd"};
  return {label:"Not suitable", cls:"st-over"};
}

  "yala|Matale|bigonion":1.9, "yala|Anuradhapura|bigonion":1.65, "maha|Nuwara Eliya|potato":1.5,

};
var CROP_BIAS = {greengram:.6, cowpea:.7, groundnut:.75};
var PRIVACY_K = 5;

var MARKET_BASE = null;
function buildMarket(){
  var M = {};
  var seasons = ["maha","yala"];
  for (var sIdx = 0; sIdx < seasons.length; sIdx++){
    var season = seasons[sIdx];
    for (var dIdx = 0; dIdx < DISTRICT_NAMES.length; dIdx++){
      var dn = DISTRICT_NAMES[dIdx];
      for (var cIdx = 0; cIdx < MARKET_CROPS.length; cIdx++){
        var c = MARKET_CROPS[cIdx];
        var key = season + "|" + dn + "|" + c.id;
        var r = mulberry32(hashStr(key));
        var s = suitability(c.id, {district:dn, season:season, soil:DISTRICTS[dn].soil, water:"minor"}).score;
        if (s < 40){ M[key] = {D:0, P:r()*4, k:r() < .5 ? 1 : 3}; continue; }
        var D = c.demand * 25 * Math.pow(s/100, 2) * (0.7 + r() * 0.6);
        var ratio = HOTSPOTS[key] ? HOTSPOTS[key] * (0.95 + r() * 0.1) : (0.7 + r() * 0.5) * (CROP_BIAS[c.id] || 1);
        var P = D * ratio;
        var avgFarm = c.group === "Grain" ? 2.2 : 1.1;
        var k = Math.max(0, Math.round(P / avgFarm * (0.8 + r() * 0.4)));
        M[key] = {D:D, P:P, k:k};
      }
    }
  }
  return M;
}
function satStatus(sat){
  if (sat < 0.85) return {label:"Under-supplied", cls:"st-under", short:"Opportunity"};
  if (sat <= 1.15) return {label:"Balanced", cls:"st-bal", short:"Balanced"};
  if (sat <= 1.4) return {label:"Crowded", cls:"st-crowd", short:"Crowded"};
  return {label:"Oversupply risk", cls:"st-over", short:"Oversupply"};
}

function marketCell(season, district, cropId){
  var c = CROP[cropId];
  if (!c.market) return null;
  if (!MARKET_BASE) MARKET_BASE = buildMarket();
  var base = MARKET_BASE[season + "|" + district + "|" + cropId];
  var D = base.D, P = base.P, k = base.k;
  var plans = (state && state.plans) ? state.plans : [];
  for (var i = 0; i < plans.length; i++){
    var p = plans[i];
    if (p.season === season && p.district === district && p.crop === cropId){ P += p.acres; k += 1; }
  }
  var suppressed = k < PRIVACY_K || D <= 0;
  var sat = D > 0 ? P / D : 0;
  var price = suppressed ? c.price : c.price * clamp(1 - 0.55 * (sat - 1), 0.45, 1.45);
  var status = suppressed ? {label:"Not enough data", cls:"st-hidden", short:"Hidden"} : satStatus(sat);
  return Object.assign({D:D, P:P, k:k, sat:sat, suppressed:suppressed, price:price}, status);
}

function contributors(season, district){
  var n = 0;
  for (var i = 0; i < MARKET_CROPS.length; i++){
    var m = marketCell(season, district, MARKET_CROPS[i].id);
    if (!m.suppressed) n += m.k;
  }
  return n;
}

function priceHistory(cropId){
  var c = CROP[cropId], r = mulberry32(hashStr("hist" + cropId)), ph = r() * 12;
  var arr = [];
  for (var i = 0; i < 12; i++){
    arr.push(Math.round(c.price * (1 + 0.16 * Math.sin((i + ph) / 12 * Math.PI * 2) + (r() - .5) * .08)));
  }
  return arr;
}

function economics(cropId, score, m, acres){
  if (!acres) acres = 1;
  var c = CROP[cropId];
  var kg = c.yield * (0.45 + 0.55 * score / 100) * acres;
  var price = m ? m.price : c.price;
  var revenue = kg * price, cost = c.cost * acres;
  return {kg:kg, price:price, revenue:revenue, cost:cost, profit:revenue - cost};
}

function rankCrops(inp, exclude){
  var list = [];
  for (var i = 0; i < MARKET_CROPS.length; i++){
    var c = MARKET_CROPS[i];
    if (c.id === exclude) continue;
    var s = suitability(c.id, inp), m = marketCell(inp.season, inp.district, c.id);
    if (s.score >= 60){
      list.push({c:c, s:s, m:m, e:economics(c.id, s.score, m)});
    }
  }
  return list.sort(function(a, b){ return b.e.profit - a.e.profit; });
}

function gardenPicks(district, space, sunHours){
  var season = currentSeason();
  var list = [];
  for (var i = 0; i < CROPS.length; i++){
    var c = CROPS[i];
    if (c.garden && (space !== "pot" || c.garden === "pot")){
      var s = suitability(c.id, {district:district, season:season, soil:"ALL", water:"well"});
      var sunFit = sunHours >= c.sun ? 1 : sunHours >= c.sun - 2 ? .7 : .4;
      list.push({c:c, score:Math.round(s.score * sunFit), s:s});
    }
  }
  return list.sort(function(a, b){ return b.score - a.score; });
}

function rgb2hsv(r, g, b){
  r/=255; g/=255; b/=255;
  var mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
  var h = 0;
  if (d){
    if (mx === r) h = ((g-b)/d) % 6;
    else if (mx === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return [h, mx ? d/mx : 0, mx];
}

function extractFeatures(src){
  var cv = document.createElement("canvas"); cv.width = cv.height = 64;
  var x = cv.getContext("2d", {willReadFrequently:true});
  x.drawImage(src, 0, 0, 64, 64);
  var px = x.getImageData(0, 0, 64, 64).data;
  var L = new Float32Array(4096);
  var green=0, blueGreen=0, red=0, purple=0, orange=0, sv=0, ss=0;
  for (var p = 0; p < 4096; p++){
    var r = px[p*4], g = px[p*4+1], b = px[p*4+2];
    var hsv = rgb2hsv(r, g, b);
    var h = hsv[0], s = hsv[1], v = hsv[2];
    L[p] = (0.299*r + 0.587*g + 0.114*b) / 255; sv += v; ss += s;
    if ((h < 15 || h > 340) && s > .45 && v > .3) red++;
    else if (h >= 15 && h < 62 && s > .5 && v > .5) orange++;
    else if (h >= 62 && h < 140 && s > .2 && v > .15) green++;
    else if (h >= 140 && h < 200 && s > .12 && v > .2) blueGreen++;
    else if (h >= 250 && h <= 340 && s > .2 && v > .12) purple++;
  }
  var edges = 0;
  for (var y = 1; y < 63; y++) for (var xx = 1; xx < 63; xx++){
    var idx = y*64 + xx;
    if (Math.hypot(L[idx+1] - L[idx-1], L[idx+64] - L[idx-64]) > .18) edges++;
  }
  var n = 4096;
  return [green/n, blueGreen/n, red/n, purple/n, orange/n, edges/3844, sv/n, ss/n];
}

    var seeds = [1, 2, 3, 4];
    for (var s = 0; s < seeds.length; s++){
      var f = extractFeatures(drawSample(id, seeds[s]));
      for (var k = 0; k < 8; k++) acc[k] += f[k] / 4;
    }
    PROTOTYPES[id] = acc;
  }
}

function classify(src){
  if (!PROTOTYPES) trainPrototypes();
  var f = extractFeatures(src);
  var dists = [];
  var sumDist = 0;
  for (var i = 0; i < ID_CLASSES.length; i++){
    var id = ID_CLASSES[i];
    var proto = PROTOTYPES[id];
    var sumSq = 0;
    for (var k = 0; k < 8; k++) sumSq += FEATURE_W[k] * Math.pow(proto[k] - f[k], 2);
    var d = Math.sqrt(sumSq);
    dists.push(d);
    sumDist += d;
  }
  var mean = sumDist / dists.length;
  var tau = Math.max(mean * .18, 1e-4);
  var ex = [], Z = 0;
  for (var j = 0; j < dists.length; j++){
    var val = Math.exp(-dists[j] / tau);
    ex.push(val);
    Z += val;
  }
  var probs = [];
  for (var pIdx = 0; pIdx < ID_CLASSES.length; pIdx++){
    probs.push({id:ID_CLASSES[pIdx], p:ex[pIdx] / Z});
  }
  probs.sort(function(a, b){ return b.p - a.p; });
  var plantFrac = f[0] + f[1], fruit = f[2] + f[3] + f[4];
  var stage = fruit > .04 ? "Flowering / fruiting" : plantFrac < .3 ? "Seedling" : "Vegetative";
  return {probs:probs, stage:stage, plant:plantFrac >= .08, features:f};
}

function drawSample(id, seed){
  var cv = document.createElement("canvas"); cv.width = cv.height = 200;
  var x = cv.getContext("2d"), r = mulberry32(hashStr(id) + seed * 7919);
  var g = x.createLinearGradient(0, 0, 0, 200); g.addColorStop(0, "#5e4330"); g.addColorStop(1, "#3f2c1f");
  x.fillStyle = g; x.fillRect(0, 0, 200, 200);
  for (var i = 0; i < 380; i++){ x.fillStyle = "rgba(" + (r()<.5?30:110) + "," + (r()<.5?20:80) + ",14," + (.2 + r()*.3) + ")"; x.fillRect(r()*200, r()*200, 2, 2); }
  var ell = function(cx, cy, rx, ry, rot, fill){ x.save(); x.translate(cx, cy); x.rotate(rot); x.beginPath(); x.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2); x.fillStyle = fill; x.fill(); x.restore(); };
  var stroke = function(pts, w, col){ x.beginPath(); x.moveTo(pts[0], pts[1]); x.quadraticCurveTo(pts[2], pts[3], pts[4], pts[5]); x.lineWidth = w; x.strokeStyle = col; x.lineCap = "round"; x.stroke(); };
  var hsl = function(h, s, l){ return "hsl(" + h + " " + s + "% " + l + "%)"; };
  switch (id){
    case "paddy":
      for (var p1 = 0; p1 < 95; p1++){ var bx = r()*200, top = 10 + r()*70; stroke([bx, 200, bx + (r()-.5)*30, 110, bx + (r()-.5)*50, top], 2, hsl(95, 55, 42 + r()*18)); }
      for (var p2 = 0; p2 < 7; p2++){ var px = 20 + r()*160, py = 20 + r()*40; stroke([px, py + 30, px + 8, py + 10, px + 18, py], 3, hsl(46, 72, 60)); }
      break;
    case "tomato":
      for (var t1 = 0; t1 < 5; t1++) stroke([30 + t1*35, 200, 40 + t1*35, 110, 25 + t1*38, 30], 3, hsl(110, 40, 26));
      for (var t2 = 0; t2 < 26; t2++) ell(20 + r()*160, 20 + r()*160, 20, 9, r()*3, hsl(108, 45, 30 + r()*10));
      for (var t3 = 0; t3 < 7; t3++){ var cx = 30 + r()*140, cy = 60 + r()*110; ell(cx, cy, 11, 11, 0, hsl(5, 80, 47)); ell(cx - 3, cy - 4, 3, 2, 0, "rgba(255,255,255,.5)"); }
      break;
    case "chilli":
      for (var c1 = 0; c1 < 40; c1++) ell(15 + r()*170, 15 + r()*170, 11, 5, r()*3, hsl(122, 50, 24 + r()*8));
      for (var c2 = 0; c2 < 14; c2++) ell(20 + r()*160, 50 + r()*130, 3.5, 16, (r()-.5)*.8, r() < .65 ? hsl(0, 85, 45) : hsl(98, 60, 40));
      break;
    default:
      for (var d1 = 0; d1 < 10; d1++) ell(20 + r()*160, 20 + r()*150, 40, 23, r()*3, hsl(100, 18, 38 + r()*8));
  }
  return cv;
}

function paintField(cv){
  var dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 130, h = cv.clientHeight || 110;
  cv.width = w * dpr; cv.height = h * dpr;
  var x = cv.getContext("2d"); x.scale(dpr, dpr);
  var r = mulberry32(42);
  for (var row = 0; row < 7; row++){
    var y = h * .25 + row * (h * .12), n = 6 + row * 2;
    for (var i = 0; i < n; i++){
      var px = w - (i + .5) * (w / n) * (1 + row * .08), s = 3 + row * 1.3;
      x.strokeStyle = "hsl(" + (88 + r()*20) + " 55% " + (42 + r()*16) + "%)"; x.lineWidth = 1.2 + row * .25; x.lineCap = "round";
      x.beginPath(); x.moveTo(px, y + s); x.quadraticCurveTo(px - s, y, px - s * 1.4, y - s * .6); x.stroke();
      x.beginPath(); x.moveTo(px, y + s); x.quadraticCurveTo(px + s, y, px + s * 1.4, y - s * .6); x.stroke();
    }
  }
}

    '<circle class="trk" cx="52" cy="52" r="' + R + '" fill="none" stroke-width="10"/>' +
    '<circle cx="52" cy="52" r="' + R + '" fill="none" stroke="' + col + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (C2 * score / 100) + " " + C2 + '" transform="rotate(-90 52 52)"/>' +
    '<text x="52" y="56" text-anchor="middle" font-size="28">' + score + '</text><text class="sub" x="52" y="72" text-anchor="middle">/ 100</text></svg>';

function priceChart(hist, fc){
  var W = 330, H = 150, pl = 44, pr = 14, pt = 12, pb = 26, n = hist.length + 2;
  var all = hist.concat([fc]), lo0 = Math.min.apply(null, all), hi0 = Math.max.apply(null, all);
  var diff = Math.max(hi0 - lo0, 10);
  var step = Math.pow(10, Math.floor(Math.log10(diff))) / (diff > 400 ? 1 : 2);
  var lo = Math.floor(lo0 * .92 / step) * step, hi = Math.ceil(hi0 * 1.05 / step) * step;
  var X = function(i){ return pl + (W - pl - pr) * i / n; };
  var Y = function(v){ return pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo)); };
  var ticks = [lo, Math.round(lo + (hi - lo) / 2), hi];
  var pts = [];
  for (var i = 0; i < hist.length; i++) pts.push(X(i).toFixed(1) + "," + Y(hist[i]).toFixed(1));
  var tickHtml = "";
  for (var tIdx = 0; tIdx < ticks.length; tIdx++){
    var val = ticks[tIdx];
    tickHtml += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(val) + '" y2="' + Y(val) + '"/><text x="' + (pl - 6) + '" y="' + (Y(val) + 3) + '" text-anchor="end">' + val + "</text>";
  }
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" width="100%" role="img" aria-label="Price history and harvest forecast">' +
    tickHtml +
    '<path class="area" d="M' + pts.join(" L") + " L" + X(hist.length - 1) + "," + (H - pb) + " L" + X(0) + "," + (H - pb) + ' Z"/>' +
    '<path class="ln" d="M' + pts.join(" L") + '"/>' +
    '<path class="fc" d="M' + X(hist.length - 1) + "," + Y(hist[hist.length - 1]) + " L" + X(n) + "," + Y(fc) + '"/>' +
    '<circle class="enddot" cx="' + X(hist.length - 1) + '" cy="' + Y(hist[hist.length - 1]) + '" r="3.5"/>' +
    '<circle class="fcdot" cx="' + X(n) + '" cy="' + Y(fc) + '" r="4.5"/>' +
    '<text x="' + X(0) + '" y="' + (H - 8) + '">Oct 25</text><text x="' + X(hist.length - 1) + '" y="' + (H - 8) + '" text-anchor="middle">Sep 26</text><text x="' + X(n) + '" y="' + (H - 8) + '" text-anchor="end">Harvest</text>' +
  "</svg>";
}

function openMarketDetail(cropId){
  var f = state.form, c = CROP[cropId], m = marketCell(f.season, f.district, cropId), lvl = tier().market;
  if (lvl < 1){ openUpgrade("Price forecasts and detailed acreage for " + c.name + " are part of the Basic plan."); return; }
  var hist = priceHistory(cropId);
  var inp = planInputs(); inp.district = f.district;
  var s = suitability(cropId, Object.assign({}, inp, {soil:DISTRICTS[f.district].soil}));
  var e = economics(cropId, s.score, m);
  var regions = [];
  for (var i = 0; i < DISTRICT_NAMES.length; i++){
    var d = DISTRICT_NAMES[i], rm = marketCell(f.season, d, cropId);
    if (!rm.suppressed) regions.push({d:d, m:rm});
  }
  regions.sort(function(a, b){ return b.m.sat - a.m.sat; });
  regions = regions.slice(0, 8);
  var maxSat = Math.max.apply(null, [2].concat(regions.map(function(r){ return r.m.sat; })));
  var regionHTML = "";
  for (var j = 0; j < regions.length; j++){
    var reg = regions[j];
    var col = reg.m.sat > 1.4 ? "var(--clay)" : reg.m.sat > 1.15 ? "var(--turmeric)" : reg.m.sat < .85 ? "var(--leaf)" : "var(--sky)";
    regionHTML += '<div class="regbar"><span>' + esc(reg.d) + '</span><div class="satbar" style="margin:0"><i style="width:' + (reg.m.sat / maxSat * 100) + "%;background:" + col + '"></i><span class="ref" style="left:' + (100 / maxSat) + '%"></span></div><span class="num xs">' + reg.m.sat.toFixed(2) + "x</span></div>";
  }
  openSheet('<div class="row">' + cropBadge(c) + '<div class="grow"><h2>' + esc(c.name) + '</h2><span class="xs muted">' + esc(f.district) + " - " + SEASONS[f.season].long + "</span></div>" + pill(m.cls, m.label) + "</div>" +
    '<div class="econ">' +
      "<div><b>" + Math.round(m.P).toLocaleString("en-US") + " ac</b><span>Planned by " + m.k + " growers</span></div>" +
      "<div><b>" + Math.round(m.D).toLocaleString("en-US") + " ac</b><span>Estimated demand</span></div>" +
      "<div><b>" + lkr(m.price) + "</b><span>Harvest forecast / kg</span></div>" +
      "<div><b>" + lkr(c.price) + "</b><span>Historical typical price</span></div>" +
      '<div style="grid-column:1/-1"><b class="' + (e.profit >= 0 ? "pos" : "neg") + '">' + lkr(e.profit) + " / acre</b><span>Estimated net profit</span></div>" +
    "</div>" +
    '<div class="card"><div class="section-h"><h2>Farm-gate price (LKR/kg)</h2><span class="xs muted">historical + model</span></div>' + priceChart(hist, Math.round(m.price)) +
      '<p class="xs muted">Solid line indicates previous months. Dashed projection indicates expected price at harvest based on planting saturation.</p></div>' +
    '<div class="card stack"><div class="section-h"><h2>Saturation across districts</h2><span class="xs muted">planted vs demand</span></div>' +
      (lvl >= 2 ? regionHTML : ('<div class="locked"><div class="veil stack">' + regionHTML + '</div><div class="lockmsg"><div class="card stack" style="gap:8px"><b>' + icon("lock") + ' Regional comparison requires Premium</b><button class="btn sm" data-act="openUpgrade">See plans</button></div></div></div>')) + "</div>" +
    '<div class="row"><button class="btn grow ghost" data-act="closeSheet">Close</button><button class="btn grow" data-act="checkCrop" data-crop="' + cropId + '">Check suitability</button></div>');
}

  drop.addEventListener("dragleave", function(){ drop.classList.remove("over"); });
  drop.addEventListener("drop", function(e){ e.preventDefault(); drop.classList.remove("over"); var file = e.dataTransfer.files[0]; if (file) readImage(file); });
  $("#imgfile").addEventListener("change", function(e){ var file = e.target.files[0]; if (file) readImage(file); e.target.value = ""; });
}
function readImage(file){
  if (!file.type.startsWith("image/")){ toast("Please upload a valid image file (JPG/PNG)."); return; }
  var rd = new FileReader();
  rd.onload = function(){ var img = new Image(); img.onload = function(){ runIdentify(img, "Your photo"); }; img.onerror = function(){ toast("Could not read image file."); }; img.src = rd.result; };
  rd.readAsDataURL(file);
}
function runIdentify(src, label){
  if (!useQuota("ids")) return;
  var cv = document.createElement("canvas"); cv.width = cv.height = 224;
  var w = src.naturalWidth || src.width, h = src.naturalHeight || src.height, s = Math.min(w, h);
  cv.getContext("2d").drawImage(src, (w - s) / 2, (h - s) / 2, s, s, 0, 0, 224, 224);
  var res = classify(cv);
  var top = res.probs[0], c = CROP[top.id], CONF = .45;
  var body = "";
  if (!res.plant){
    body = '<div class="callout warn">' + icon("alert") + "<span>No plant features detected. Please ensure foliage fills the frame under clear lighting.</span></div>";
  } else {
    var sure = top.p >= CONF;
    var probBars = "";
    var top3 = res.probs.slice(0, 3);
    for (var i = 0; i < top3.length; i++){
      var p = top3[i];
      probBars += '<div class="prob"><span>' + esc(CROP[p.id].name) + '</span><div class="bar"><i style="width:' + pct(p.p) + '%"></i></div><span class="num xs">' + pct(p.p) + "%</span></div>";
    }
    body = (sure ? ('<div class="row wrap"><h2>' + esc(c.name) + "</h2>" + pill("st-under", pct(top.p) + "% match") + "</div>") :
                   ('<div class="callout warn">' + icon("alert") + "<span>Low confidence (" + pct(top.p) + "%). Closest match is " + esc(c.name) + ". Try a clearer photo.</span></div>")) +
      '<div class="xs muted">Estimated growth stage: <b>' + res.stage + "</b></div>" +
      '<div class="stack" style="gap:6px">' + probBars + "</div>";
  }
  $("#id-result").innerHTML = '<div class="card stack">' +
      '<div class="idwrap"><canvas id="id-preview" width="224" height="224" aria-label="' + esc(label) + '"></canvas><div class="stack grow" style="gap:8px;min-width:0">' + body + "</div></div>" +
      (res.plant ? ('<p class="small"><b>Care note:</b> ' + esc(c.tip) + '</p><div id="fb" class="stack" style="gap:8px"><span class="small muted">Is this correct?</span><div class="row"><button class="btn sm soft grow" data-act="fbYes" data-crop="' + top.id + '">' + icon("check") + ' Yes</button><button class="btn sm ghost grow" data-act="fbNo" data-crop="' + top.id + '">No, send correction</button></div></div>') : "") +
    "</div>";
  $("#id-preview").getContext("2d").drawImage(cv, 0, 0);
  state.history.unshift({type:"id", crop:top.id, p:top.p, at:Date.now()}); state.history = state.history.slice(0, 20); save();
  $("#id-result").scrollIntoView({behavior:"smooth", block:"nearest"});
}

function screenChat(){
  var chatHtml = "";
  for (var i = 0; i < state.chat.length; i++) chatHtml += '<div class="msg ' + state.chat[i].from + '">' + state.chat[i].html + "</div>";
  var chipList = ["What should I plant this season?","Price of green gram","Pests on chilli","Can I grow potato in Kandy?","Best plants for a balcony"];
  var chipHtml = "";
  for (var j = 0; j < chipList.length; j++) chipHtml += '<button class="chip" data-act="ask" data-q="' + esc(chipList[j]) + '">' + esc(chipList[j]) + "</button>";
  $("#screen").innerHTML = '<div class="msgs" id="msgs">' + chatHtml + "</div>" +
    '<div class="composer">' +
      '<div class="chips">' + chipHtml + "</div>" +
      '<form id="f-chat"><input id="chat-in" placeholder="Ask about crops, prices, pests..." autocomplete="off" aria-label="Message"><button class="btn" aria-label="Send">' + icon("send") + "</button></form>" +
    "</div>";
  var sc = $("#screen"); sc.scrollTop = sc.scrollHeight;
}
function sendChat(text){
  text = text.trim(); if (!text) return;
  state.chat.push({from:"me", html:"<p>" + esc(text) + "</p>"});
  var msgs = $("#msgs");
  msgs.insertAdjacentHTML("beforeend", '<div class="msg me"><p>' + esc(text) + '</p></div><div class="msg bot typing" id="typing"><span></span><span></span><span></span></div>');
  $("#screen").scrollTop = $("#screen").scrollHeight;
  setTimeout(function(){
    var html = botReply(text);
    state.chat.push({from:"bot", html:html}); state.chat = state.chat.slice(-40); save();
    var t = $("#typing"); if (t){ t.classList.remove("typing"); t.removeAttribute("id"); t.innerHTML = html; }
    $("#screen").scrollTop = $("#screen").scrollHeight;
  }, 550);
}

function botReply(raw){
  var m = raw.toLowerCase(), u = state.user;
  var crop = findCrop(m), district = findDistrict(m) || u.district, season = findSeason(m) || currentSeason();
  var inp = {district:district, season:season, soil:DISTRICTS[district].soil, water:u.water || "minor"};
  var S = SEASONS[season];
  var cropRow = function(c, rightSide){ return '<div class="li">' + cropBadge(c) + '<div class="grow"><div class="t">' + esc(c.name) + '</div></div><div class="right">' + rightSide + "</div></div>"; };

  if (/^(hi|hello|hey|ayubowan|vanakkam|good (morning|evening))\b/.test(m))
    return "<p>Hello " + esc(u.name) + "! Ask what to plant, check market conditions, or review crop management guidelines.</p>";
  if (/(subscription|premium|basic plan|upgrade|my plan|free plan)/.test(m))
    return "<p>You are on the <b>" + tier().name + "</b> tier: " + tier().perks.join(", ").toLowerCase() + '.</p><p><button class="link" data-act="openUpgrade">Compare plans</button></p>';
  if (/(balcony|pot|rooftop|home garden|kitchen garden|garden)/.test(m)){
    var g = gardenPicks(district, /yard/.test(m) ? "yard" : "pot", 6).slice(0, 4);
    var gHtml = "";
    for (var gi = 0; gi < g.length; gi++) gHtml += cropRow(g[gi].c, pill(suitLabel(g[gi].score).cls, g[gi].score + "/100"));
    return "<p>Recommended for containers or backyard plots in " + esc(district) + ' with good sun exposure:</p><div class="list">' + gHtml + "</div>";
  }
  if (/(price|market|demand|sell|oversuppl|saturat|glut)/.test(m)){
    if (crop && CROP[crop].market){
      var mk = marketCell(season, district, crop), c = CROP[crop];
      if (mk.suppressed) return "<p>Fewer than 5 farmers have registered " + esc(c.name) + " plans in " + esc(district) + " for " + S.long + ". Baseline historical price is " + lkr(c.price) + "/kg.</p>";
      return "<p><b>" + esc(c.name) + " in " + esc(district) + " (" + S.long + ")</b></p><p>" + pill(mk.cls, mk.label) + " " + Math.round(mk.P) + " acres planned against " + Math.round(mk.D) + " acres expected demand.</p><p>Forecast farm-gate price: <b>" + lkr(mk.price) + "/kg</b> (typical: " + lkr(c.price) + ").</p>";
    }
    var cells = [];
    for (var ci = 0; ci < MARKET_CROPS.length; ci++){
      var cellM = marketCell(season, district, MARKET_CROPS[ci].id);
      if (!cellM.suppressed) cells.push({c:MARKET_CROPS[ci], mk:cellM});
    }
    var over = cells.filter(function(x){ return x.mk.sat > 1.15; }).sort(function(a,b){ return b.mk.sat - a.mk.sat; }).slice(0, 3);
    var opp = cells.filter(function(x){ return x.mk.sat < .85; }).sort(function(a,b){ return a.mk.sat - b.mk.sat; }).slice(0, 3);
    var overHtml = "", oppHtml = "";
    for (var oi = 0; oi < over.length; oi++) overHtml += cropRow(over[oi].c, pill(over[oi].mk.cls, over[oi].mk.sat.toFixed(1) + "x"));
    for (var pi = 0; pi < opp.length; pi++) oppHtml += cropRow(opp[pi].c, pill(opp[pi].mk.cls, pct(opp[pi].mk.sat) + "%"));
    return "<p><b>Market overview - " + esc(district) + " (" + S.long + ")</b></p>" + (over.length ? ('<p>Crowded crops:</p><div class="list">' + overHtml + "</div>") : "") + (opp.length ? ('<p>High demand opportunity:</p><div class="list">' + oppHtml + "</div>") : "");
  }
  if (/(fertili[sz]|manure|urea|npk|compost|nutrient)/.test(m)){
    var cf = crop ? CROP[crop] : null;
    return "<p>" + (cf ? ("For <b>" + esc(cf.name) + "</b>: ") : "") + "Work in compost before planting, provide balanced basal nutrients, and schedule top dressings during vegetative growth. Avoid fertilizer applications directly ahead of forecast heavy rainfall.</p>";
  }
  if (/(pest|disease|insect|worm|bug|fung|blight|curl|spots?|rot|wilt|mite|thrip|aphid)/.test(m)){
    var cp = crop ? CROP[crop] : null;
    return (cp ? ("<p><b>" + esc(cp.name) + ":</b> " + esc(cp.pest) + "</p>") : "") + '<p>General guidance: scout fields weekly, eliminate diseased foliage immediately, and apply interventions only when damage exceeds economic thresholds.</p><p>Use <button class="link" data-act="goto" data-tab="identify">Identify</button> to scan plant health.</p>';
  }
  if (/(water|irrigat|drought|how much rain|watering)/.test(m)){
    var dw = DISTRICTS[district], cw = crop ? CROP[crop] : null;
    return "<p>" + esc(district) + " receives approximately <b>" + dw[season] + " mm</b> of rainfall during " + S.long + (cw ? (", while " + esc(cw.name) + " requires " + cw.rain[0] + "-" + cw.rain[1] + " mm across its cycle") : "") + ".</p>";
  }
  if (crop && /(suitab|grow|can i|good for|possible|ok to|okay to)/.test(m)){
    var ss = suitability(crop, inp), cs = CROP[crop], mks = marketCell(season, district, crop);
    var weakest = ss.factors.slice().sort(function(a, b){ return a.v - b.v; })[0];
    return "<p><b>" + esc(cs.name) + " in " + esc(district) + " (" + S.name + "):</b> " + pill(ss.cls, ss.label + " - " + ss.score + "/100") + "</p><p>Limiting constraint: " + esc(weakest.name.toLowerCase()) + " (" + esc(weakest.note) + ").</p>" + (mks && !mks.suppressed ? ("<p>Market status: " + pill(mks.cls, mks.label) + "</p>") : "") + '<p><button class="link" data-act="checkCrop" data-crop="' + crop + '">Open full analysis</button></p>';
  }
  if (/(what|which|best|recommend|suggest|should).*(grow|plant|crop|cultivat)|recommend|suggest/.test(m)){
    var rList = rankCrops(inp).slice(0, 4);
    if (!rList.length) return "<p>No crops reached high compatibility under current baseline parameters in " + esc(district) + ". Consider adjusting irrigation supply.</p>";
    var rHtml = "";
    for (var ri = 0; ri < rList.length; ri++) rHtml += cropRow(rList[ri].c, pill(rList[ri].m.cls, rList[ri].s.score + " - " + rList[ri].m.short));
    return '<p>Highest return-on-investment crops for <b>' + esc(district) + " (" + S.long + ')</b>:</p><div class="list">' + rHtml + "</div>";
  }
  if (crop){
    var cd = CROP[crop], sd = suitability(crop, inp), mkd = marketCell(season, district, crop);
    return "<p><b>" + esc(cd.name) + "</b> (" + esc(cd.days) + ")</p><p>" + esc(cd.tip) + "</p><p>Suitability in " + esc(district) + ": " + pill(sd.cls, sd.label) + " " + (mkd && !mkd.suppressed ? pill(mkd.cls, mkd.label) : "") + "</p>";
  }
  return '<p>Ask AgrI about:</p><div class="chips"><button class="chip" data-act="ask" data-q="What should I plant this season?">What to plant</button><button class="chip" data-act="ask" data-q="Market pulse">Market pulse</button><button class="chip" data-act="ask" data-q="Fertilizer for paddy">Fertilizer</button><button class="chip" data-act="ask" data-q="When is Yala season?">Seasons</button></div>';
}

function openProfile(){
  if (!state.user){ toast("Please sign in or select a demo profile."); return; }
  var u = state.user, t = tier();
  var q = function(used, lim){ return '<b class="num">' + used + " / " + (lim === Infinity ? "unlimited" : lim) + "</b>"; };
  var distOpts = "";
  for (var i = 0; i < DISTRICT_NAMES.length; i++) distOpts += "<option " + (DISTRICT_NAMES[i] === u.district ? "selected" : "") + ">" + DISTRICT_NAMES[i] + "</option>";
  var waterOpts = "";
  for (var wk in WATER) waterOpts += '<option value="' + wk + '" ' + (wk === u.water ? "selected" : "") + ">" + WATER[wk].name + "</option>";

  openSheet('<div class="row"><span class="iconbtn avatar" style="width:48px;height:48px;font-size:20px">' + esc(u.name[0].toUpperCase()) + '</span><div class="grow"><h2>' + esc(u.name) + '</h2><span class="xs muted">' + esc(u.phone) + " - " + (u.role === "farmer" ? "Commercial Farmer" : "Home Gardener") + " - " + esc(u.district) + "</span></div></div>" +
    '<div class="card stack"><div class="section-h"><h2>' + t.name + ' Plan</h2><button class="link" data-act="openUpgrade">Change</button></div>' +
      '<div class="quota"><div class="tile"><span>Crop checks today</span>' + q(state.usage.checks, t.checks) + '</div><div class="tile"><span>Plant IDs today</span>' + q(state.usage.ids, t.ids) + "</div></div></div>" +
    '<div class="field"><span class="lbl">Operating Mode</span><div class="seg">' +
      '<label><input type="radio" name="pr-role" value="farmer" ' + (u.role === "farmer" ? "checked" : "") + ' data-act="setRole"><span>Commercial Farmer</span></label>' +
      '<label><input type="radio" name="pr-role" value="gardener" ' + (u.role === "gardener" ? "checked" : "") + ' data-act="setRole"><span>Home Gardener</span></label></div></div>" +
    '<div class="grid2">' +
      '<div class="field"><label for="pr-district">Home district</label><select id="pr-district">' + distOpts + "</select></div>" +
      '<div class="field"><label for="pr-water">Water source</label><select id="pr-water">' + waterOpts + "</select></div></div>" +
    '<p class="xs muted">' + state.plans.length + " season plans shared - " + state.feedback.length + " model validations saved locally.</p>" +
    '<div class="row"><button class="btn ghost grow" data-act="signOut">Sign out</button><button class="btn grow" data-act="saveProfile">Save</button></div>' +
    '<button class="link" data-act="resetAll" style="align-self:center">Reset all demo data</button>');
}

function openUpgrade(reason){
  var tiersHtml = "";
  for (var k in TIERS){
    var t = TIERS[k];
    var perksList = "";
    for (var i = 0; i < t.perks.length; i++) perksList += "<li>" + esc(t.perks[i]) + "</li>";
    tiersHtml += '<div class="tier ' + (state.tier === k ? "cur" : "") + '"><div class="row"><b class="grow" style="font-family:var(--display);font-size:17px">' + t.name + '</b><span class="num small">' + t.price + "</span></div>" +
      "<ul>" + perksList + "</ul>" +
      (state.tier === k ? '<span class="xs" style="color:var(--leaf);font-weight:700">Current tier</span>' : ('<button class="btn sm" data-act="setTier" data-tier="' + k + '">Select ' + t.name + "</button>")) + "</div>";
  }
  openSheet("<h2>Select Subscription Tier</h2>" +
    (reason ? ('<div class="callout info">' + icon("info") + '<span class="small">' + esc(reason) + "</span></div>") : "") +
    tiersHtml + '<p class="xs muted">Simulation only - no live billing transactions take place.</p>');
}

function openAlerts(){
  var alertsList = buildAlerts();
  var alertsHtml = "";
  for (var i = 0; i < alertsList.length; i++){
    var a = alertsList[i];
    alertsHtml += '<div class="callout ' + a.tone + '">' + icon(a.tone === "warn" ? "alert" : a.tone === "good" ? "check" : "info") + "<div><b>" + esc(a.title) + '</b><br><span class="xs">' + esc(a.body) + "</span></div></div>";
  }
  openSheet("<h2>Regional Alerts</h2>" + alertsHtml + '<button class="btn ghost" data-act="closeSheet">Close</button>');
}

function openRegister(){
  var plan = state.lastPlan, crop = plan.crop, acres = plan.acres, f = state.form;
  openSheet("<h2>Add " + esc(CROP[crop].name) + " to your season plan</h2>" +
    '<p class="small muted">' + esc(f.district) + " - " + SEASONS[f.season].long + ". Acreage is aggregated with privacy safeguards (k >= 5).</p>" +
    '<form id="f-register" class="stack"><div class="field"><label for="r-acres">Acres to cultivate</label><input id="r-acres" type="number" min="0.1" step="0.1" value="' + acres + '"></div>' +
      '<button class="btn block">Commit to Plan</button></form>');
}

var ACTIONS = {
  goto: function(d){ if (!state.user){ toast("Please sign in or select a demo profile."); return; } closeSheet(); state.tab = d.tab; save(); render(); $("#screen").scrollTop = 0; },
  demoLogin: function(d){ closeSheet(); signIn(Object.assign({}, DEMO_USERS[d.who])); toast("Signed in as " + DEMO_USERS[d.who].name); },
  resetAll: function(){ try { localStorage.removeItem(STORE_KEY); } catch (e) {} state = freshState(); closeSheet(); render(); toast("Demo state reset."); },
  loginBack: function(){ state.loginStep = "phone"; render(); },
  closeSheet: closeSheet,
  openProfile: openProfile,
  openAlerts: openAlerts,
  openUpgrade: function(){ openUpgrade(); },
  setTier: function(d){ state.tier = d.tier; save(); closeSheet(); render(); toast("Switched to " + TIERS[d.tier].name + " tier."); },
  checkCrop: function(d){
    closeSheet();
    if (state.user.role === "gardener"){ state.tab = "plan"; render(); return; }
    state.form.crop = d.crop; state.tab = "plan";
    if (!useQuota("checks")){ render(); return; }
    state.lastPlan = {crop:d.crop, acres:state.form.acres}; save(); render();
    requestAnimationFrame(function(){ var res = $("#plan-result"); if (res) res.scrollIntoView({behavior:"smooth"}); });
  },
  registerPlan: openRegister,
  marketDetail: function(d){ openMarketDetail(d.crop); },
  sampleId: function(d){ runIdentify(drawSample(d.crop, 11), "Sample " + CROP[d.crop].name); },
  fbYes: function(d){ state.feedback.push({predicted:d.crop, actual:d.crop, at:Date.now()}); save(); $("#fb").innerHTML = '<div class="callout good">' + icon("check") + '<span class="small">Classification confirmed. Thank you.</span></div>'; },
  fbNo: function(d){
    var opts = "";
    for (var i = 0; i < CROPS.length; i++){
      if (CROPS[i].id !== d.crop) opts += '<option value="' + CROPS[i].id + '">' + esc(CROPS[i].name) + "</option>";
    }
    $("#fb").innerHTML = '<div class="field"><label for="fb-sel">Select true species</label><select id="fb-sel">' + opts + '<option value="other">Other unlisted species</option></select></div>' +
      '<button class="btn sm" data-act="fbSend" data-crop="' + d.crop + '">Submit Correction</button>';
  },
  fbSend: function(d){ state.feedback.push({predicted:d.crop, actual:$("#fb-sel").value, at:Date.now()}); save(); $("#fb").innerHTML = '<div class="callout good">' + icon("check") + '<span class="small">Correction logged for model retraining.</span></div>'; },
  ask: function(d){ if (state.tab !== "chat"){ state.tab = "chat"; render(); } sendChat(d.q); },
  signOut: function(){ state.user = null; state.chat = []; state.lastPlan = null; closeSheet(); save(); render(); },
  saveProfile: function(){
    var u = state.user;
    u.role = document.querySelector('input[name="pr-role"]:checked').value;
    u.district = $("#pr-district").value; u.water = $("#pr-water").value;
    state.form.district = u.district; state.form.water = u.water; state.lastPlan = null;
    save(); closeSheet(); render(); toast("Profile saved.");
  },
  setRole: function(){}
};

document.addEventListener("click", function(e){
  var a = e.target.closest("[data-act]");
  if (!a || a.disabled) return;
  if (a.tagName === "INPUT") return;
  var fn = ACTIONS[a.dataset.act]; if (fn){ e.preventDefault(); fn(a.dataset, a); }
});

document.addEventListener("submit", function(e){
  e.preventDefault();
  var id = e.target.id, f = state.form;
  if (id === "f-phone"){
    var digits = $("#phone").value.replace(/\D/g, "");
    if (digits.length < 9){ toast("Please enter a valid mobile number."); return; }
    state.phone = $("#phone").value.trim(); state.loginStep = "otp"; render(); var otp = $("#otp"); if (otp) otp.focus();
  } else if (id === "f-otp"){
    if ($("#otp").value.trim() !== "123456"){ toast("Incorrect code. For this prototype use 123456."); return; }
    state.loginStep = "onboard"; render();
  } else if (id === "f-onboard"){
    var name = $("#ob-name").value.trim() || "Farmer";
    signIn({name:name, phone:state.phone, role:document.querySelector('input[name="role"]:checked').value,
            district:$("#ob-district").value, acres:Math.max(.1, +$("#ob-acres").value || 1), water:$("#ob-water").value, space:"pot", sun:6});
  } else if (id === "f-plan"){
    Object.assign(f, {crop:$("#p-crop").value, district:$("#p-district").value, season:document.querySelector('input[name="p-season"]:checked').value,
                      soil:$("#p-soil").value, water:$("#p-water").value, acres:Math.max(.1, +$("#p-acres").value || 1)});
    if (!useQuota("checks")) return;
    state.lastPlan = {crop:f.crop, acres:f.acres};
    state.history.unshift({type:"check", crop:f.crop, at:Date.now()}); state.history = state.history.slice(0, 20);
    save(); render(); requestAnimationFrame(function(){ var res = $("#plan-result"); if (res) res.scrollIntoView({behavior:"smooth"}); });
  } else if (id === "f-register"){
    var acres = Math.max(.1, +$("#r-acres").value || 1);
    state.plans.push({crop:state.lastPlan.crop, district:f.district, season:f.season, acres:acres, at:Date.now()});
    save(); closeSheet(); render(); toast("Added " + acres + " acres of " + CROP[state.lastPlan.crop].name + " to " + f.district + " data.");
  } else if (id === "f-chat"){
    var v = $("#chat-in").value; $("#chat-in").value = ""; sendChat(v);
  }
});

document.addEventListener("change", function(e){
  var t = e.target, f = state.form; if (!f) return;
  if (t.id === "m-district"){ f.district = t.value; save(); screenMarket(); }
  else if (t.name === "m-season"){ f.season = t.value; save(); screenMarket(); }
  else if (t.id === "g-district"){ f.district = t.value; save(); screenGarden(); }
  else if (t.name === "g-space"){ f.space = t.value; save(); screenGarden(); }
  else if (t.name === "g-sun"){ f.sun = +t.value; save(); screenGarden(); }
  else if (t.id === "p-district"){
    f.district = t.value; var opt = $('#p-soil option[value="auto"]'); if (opt) opt.textContent = "Not sure - use typical for district (" + SOILS[DISTRICTS[t.value].soil] + ")";
  }
});

window.addEventListener("online", renderChrome);
window.addEventListener("offline", renderChrome);

load();
render();
</script>
